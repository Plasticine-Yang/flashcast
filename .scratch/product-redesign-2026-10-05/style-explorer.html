/* 并排与单张之间、视口与筛选变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */
::view-transition-group(*){animation-duration:var(--glide-d);animation-timing-function:var(--glide)}
::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口、筛选、说明开关和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

=\"14\" height=\"16\" rx=\"2\"/>\u003cpath d=\"M9 3h6v4H9zM9 12h6M9 16h4\"/>\u003c/svg>剪贴板\u003c/button>\u003cbutton :class=\"{active:section==='workspace'}\" @click=\"section='workspace';toast=''\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M3 6h6l2 2h10v12H3z\"/>\u003c/svg>工作区\u003c/button>\u003cdiv class=\"navlabel\" style=\"margin-top:19px\">更多\u003c/div>\u003cbutton disabled>功能插件\u003c/button>\u003cbutton disabled>同步与变更\u003c/button>\u003c/nav>\u003cdiv class=\"content\">\n\u003csection x-show=\"section==='hotkey'\">\u003cdiv class=\"eyebrow\">日常操作\u003c/div>\u003ch1>快捷键\u003c/h1>\u003cp class=\"intro\">设置唤起 Flashcast 的组合键。\u003c/p>\u003cdiv class=\"fieldline\">\u003cdiv>\u003ch3>全局快捷键\u003c/h3>\u003cp>点击右侧修改组合键\u003c/p>\u003c/div>\u003cbutton class=\"keyset\" @click=\"toast='当前快捷键：Ctrl + Alt + Space'\">\u003ckbd>Ctrl\u003c/kbd>\u003ckbd>Alt\u003c/kbd>\u003ckbd>Space\u003c/kbd>\u003c/button>\u003c/div>\u003cdiv class=\"fieldline\">\u003cdiv>\u003ch3>搜索与执行\u003c/h3>\u003cp>方向键选择，回车执行\u003c/p>\u003c/div>\u003ckbd>↑ ↓ ↵\u003c/kbd>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" @click=\"toast='已保留当前快捷键'\">保存快捷键\u003c/button>\u003c/div>\u003c/section>\n\u003csection x-show=\"section==='theme'\" x-cloak>\u003cdiv class=\"eyebrow\">偏好设置\u003c/div>\u003ch1>外观\u003c/h1>\u003cp class=\"intro\">让 Flashcast 适应你的工作环境。\u003c/p>\u003cdiv class=\"themes\">\u003cbutton class=\"theme\" :class=\"{chosen:appearance==='light'}\" @click=\"appearance='light';toast='已选择浅色'\">\u003cdiv class=\"thumb\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003cspan class=\"name\">浅色 \u003cspan class=\"check\">✓\u003c/span>\u003c/span>\u003c/button>\u003cbutton class=\"theme\" :class=\"{chosen:appearance==='dark'}\" @click=\"appearance='dark';toast='已选择深色'\">\u003cdiv class=\"thumb dark\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003cspan class=\"name\">深色 \u003cspan class=\"check\">✓\u003c/span>\u003c/span>\u003c/button>\u003cbutton class=\"theme\" :class=\"{chosen:appearance==='system'}\" @click=\"appearance='system';toast='已选择跟随系统'\">\u003cdiv class=\"thumb system\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003cspan class=\"name\">跟随系统 \u003cspan class=\"check\">✓\u003c/span>\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"fieldline\" style=\"margin-top:17px\">\u003cdiv>\u003ch3>主题插件\u003c/h3>\u003cp>使用本地主题包定制外观\u003c/p>\u003c/div>\u003cbutton class=\"secondary\" disabled>安装主题\u003c/button>\u003c/div>\u003c/section>\n\u003csection x-show=\"section==='memos'\" x-cloak>\u003cdiv class=\"memoheader\">\u003cdiv>\u003cdiv class=\"eyebrow\">数据与内容\u003c/div>\u003ch1>备忘录\u003c/h1>\u003c/div>\u003cbutton class=\"primary\" @click=\"editing=true;draft=''\">新建\u003c/button>\u003c/div>\u003cp class=\"intro\">通过标签快速找到常用内容。\u003c/p>\u003cdiv class=\"memolist\" x-show=\"!editing\">\u003cdiv class=\"memoitem\">\u003cdiv>\u003cstrong>常用回复\u003c/strong>\u003cp x-text=\"saved\">\u003c/p>\u003csmall>回复 · 工作\u003c/small>\u003c/div>\u003cbutton @click=\"editing=true;draft=saved\">编辑\u003c/button>\u003c/div>\u003cdiv class=\"memoitem\">\u003cdiv>\u003cstrong>会议邀请\u003c/strong>\u003cp>下午三点在三楼会议室，麻烦确认一下时间。\u003c/p>\u003csmall>会议 · 工作\u003c/small>\u003c/div>\u003cbutton @click=\"toast='已选择会议邀请'\">编辑\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"editor\" x-cloak x-show=\"editing\">\u003clabel>\u003csmall>标题\u003c/small>\u003cinput aria-label=\"备忘录标题\" value=\"常用回复\">\u003c/label>\u003clabel>\u003csmall>正文\u003c/small>\u003ctextarea aria-label=\"备忘录正文\" x-model=\"draft\">\u003c/textarea>\u003c/label>\u003cdiv class=\"actions\">\u003cbutton class=\"secondary\" @click=\"editing=false\">取消\u003c/button>\u003cbutton class=\"primary\" @click=\"saved=draft;editing=false;toast='已更新常用回复'\">保存\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n\u003csection x-show=\"section==='clipboard'\" x-cloak>\u003cdiv class=\"eyebrow\">数据与内容\u003c/div>\u003ch1>剪贴板历史\u003c/h1>\u003c 003ci>\u003c/i>\u003c/div>\u003cspan class=\"name\">深色 \u003cspan class=\"check\">✓\u003c/span>\u003c/span>\u003c/button>\u003cbutton class=\"theme\" :class=\"{chosen:appearance==='system'}\" @click=\"appearance='system';toast='已选择跟随系统'\">\u003cdiv class=\"thumb system\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003cspan class=\"name\">跟随系统 \u003cspan class=\"check\">✓\u003c/span>\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"fieldline\" style=\"margin-top:17px\">\u003cdiv>\u003ch3>主题插件\u003c/h3>\u003cp>使用本地主题包定制外观\u003c/p>\u003c/div>\u003cbutton class=\"secondary\" disabled>安装主题\u003c/button>\u003c/div>\u003c/section>\n\u003csection x-show=\"section==='memos'\" x-cloak>\u003cdiv class=\"memoheader\">\u003cdiv>\u003cdiv class=\"eyebrow\">数据与内容\u003c/div>\u003ch1>备忘录\u003c/h1>\u003c/div>\u003cbutton class=\"primary\" @click=\"editing=true;draft=''\">新建\u003c/button>\u003c/div>\u003cp class=\"intro\">通过标签快速找到常用内容。\u003c/p>\u003cdiv class=\"memolist\" x-show=\"!editing\">\u003cdiv class=\"memoitem\">\u003cdiv>\u003cstrong>常用回复\u003c/strong>\u003cp x-text=\"saved\">\u003c/p>\u003csmall>回复 · 工作\u003c/small>\u003c/div>\u003cbutton @click=\"editing=true;draft=saved\">编辑\u003c/button>\u003c/div>\u003cdiv class=\"memoitem\">\u003cdiv>\u003cstrong>会议邀请\u003c/strong>\u003cp>下午三点在三楼会议室，麻烦确认一下时间。\u003c/p>\u003csmall>会议 · 工作\u003c/small>\u003c/div>\u003cbutton @click=\"toast='已选择会议邀请'\">编辑\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"editor\" x-cloak x-show=\"editing\">\u003clabel>\u003csmall>标题\u003c/small>\u003cinput aria-label=\"备忘录标题\" value=\"常用回复\">\u003c/label>\u003clabel>\u003csmall>正文\u003c/small>\u003ctextarea aria-label=\"备忘录正文\" x-model=\"draft\">\u003c/textarea>\u003c/label>\u003cdiv class=\"actions\">\u003cbutton class=\"secondary\" @click=\"editing=false\">取消\u003c/button>\u003cbutton class=\"primary\" @click=\"saved=draft;editing=false;toast='已更新常用回复'\">保存\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n\u003csection x-show=\"section==='clipboard'\" x-cloak>\u003cdiv class=\"eyebrow\">数据与内容\u003c/div>\u003ch1>剪贴板历史\u003c/h1>\u003cp class=\"intro\">重新找到复制过的文字、图片和文件。\u003c/p>\u003cdiv class=\"fieldline\">\u003cdiv>\u003ch3>记录剪贴板\u003c/h3>\u003cp x-text=\"paused?'已暂停新内容记录':'正在记录新内容'\">\u003c/p>\u003c/div>\u003cbutton class=\"secondary\" @click=\"paused=!paused\" x-text=\"paused?'继续记录':'暂停记录'\">\u003c/button>\u003c/div>\u003cdiv class=\"fieldline\">\u003cdiv>\u003ch3>保留期限\u003c/h3>\u003cp>到期后自动清理\u003c/p>\u003c/div>\u003cspan>30 天\u003c/span>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"secondary\" @click=\"screen='home';scope='clip';idx=0;q=''\">查看历史\u003c/button>\u003c/div>\u003c/section>\n\u003csection x-show=\"section==='workspace'\" x-cloak>\u003cdiv class=\"eyebrow\">配置与同步\u003c/div>\u003ch1>配置工作区\u003c/h1>\u003cp class=\"intro\">用 Git 管理设置、插件和备忘录。\u003c/p>\u003cdiv class=\"fieldline\">\u003cdiv>\u003ch3>关联本地仓库\u003c/h3>\u003cp>选择已有目录作为配置工作区\u003c/p>\u003c/div>\u003cbutton class=\"secondary\" disabled>选择目录\u003c/button>\u003c/div>\u003cdiv class=\"fieldline\">\u003cdiv>\u003ch3>从远端克隆\u003c/h3>\u003cp>将已有配置带到这台设备\u003c/p>\u003c/div>\u003cbutton class=\"secondary\" disabled>克隆仓库\u003c/button>\u003c/div>\u003c/section>\n\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"toast\" x-cloak x-show=\"toast\" @click=\"toast=''\" role=\"status\" x-text=\"toast\">\u003c/div>\u003c/main>\u003cscript>/*! Alpine.js 3.17.4 | MIT License | https://github.com/alpinejs/alpine */\n(()=>{var bt=!1,Et=!1,B=[],vt=-1,Fe=!1,wt=!1;function gr(e){ai(e)}function xr(){wt=!0}function yr(){wt=!1,br()}function ai(e){B.includes(e)||(B.push(e),e._x_schedulerPriority!==void 0&&(Fe=!0)),br()}function ue(e){let t=B.indexOf(e);t!==-1&&t>vt&&B.splice(t,1)}function br(){if(!Et&&!bt){if(wt)return;bt=!0,queueMicrotask(ci)}}function ci(){bt=!1,Et=!0;for(let e=0;e\u003cB.length;e++)Fe&&li(e),B[e](),vt=e;B.length=0,vt=-1,Fe=!1,Et=!1}function li(e){let t=new Map,r=B.slice(e).sort((n,i)=>fi(n,i,t));for(let n=0 span style=\"margin-left:auto\">\u003ckbd>↑\u003c/kbd> \u003ckbd>↓\u003c/kbd> 选择\u003c/span>\u003cspan class=\"right\">\u003ckbd>↵\u003c/kbd>\u003cspan x-text=\"scope==='all'?'打开':'粘贴'\">\u003c/span>\u003c/span>\u003c/footer>\u003c/div>\n\u003csection class=\"settings\" x-cloak x-show=\"screen==='settings'\">\u003cheader class=\"settingshead\">\u003cbutton @click=\"screen='home';toast=''\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m14 5-7 7 7 7\"/>\u003c/svg> 搜索\u003c/button>\u003cspan>设置\u003c/span>\u003cspan class=\"brand\">FLASHCAST\u003c/span>\u003c/header>\u003cdiv class=\"settingslayout\">\u003cnav class=\"nav\" aria-label=\"设置分类\">\u003cdiv class=\"navlabel\">偏好设置\u003c/div>\u003cbutton :class=\"{active:section==='hotkey'}\" @click=\"section='hotkey';toast=''\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"8\" cy=\"10\" r=\"5\"/>\u003cpath d=\"m12 14 8 7m-4-3 3-3\"/>\u003c/svg>快捷键\u003c/button>\u003cbutton :class=\"{active:section==='theme'}\" @click=\"section='theme';toast=''\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 3v18M3 12h9\"/>\u003c/svg>外观\u003c/button>\u003cbutton :class=\"{active:section==='memos'}\" @click=\"section='memos';toast=''\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M6 3h12v18H6zM9 7h6M9 11h6M9 15h4\"/>\u003c/svg>备忘录\u003c/button>\u003cbutton :class=\"{active:section==='clipboard'}\" @click=\"section='clipboard';toast=''\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"5\" y=\"5\" width=\"14\" height=\"16\" rx=\"2\"/>\u003cpath d=\"M9 3h6v4H9zM9 12h6M9 16h4\"/>\u003c/svg>剪贴板\u003c/button>\u003cbutton :class=\"{active:section==='workspace'}\" @click=\"section='workspace';toast=''\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M3 6h6l2 2h10v12H3z\"/>\u003c/svg>工作区\u003c/button>\u003cdiv class=\"navlabel\" style=\"margin-top:19px\">更多\u003c/div>\u003cbutton disabled>功能插件\u003c/button>\u003cbutton disabled>同步与变更\u003c/button>\u003c/nav>\u003cdiv class=\"content\">\n\u003csection x-show=\"section==='hotkey'\">\u003cdiv class=\"eyebrow\">日常操作\u003c/div>\u003ch1>快捷键\u003c/h1>\u003cp class=\"intro\">设置唤起 Flashcast 的组合键。\u003c/p>\u003cdiv class=\"fieldline\">\u003cdiv>\u003ch3>全局快捷键\u003c/h3>\u003cp>点击右侧修改组合键\u003c/p>\u003c/div>\u003cbutton class=\"keyset\" @click=\"toast='当前快捷键：Ctrl + Alt + Space'\">\u003ckbd>Ctrl\u003c/kbd>\u003ckbd>Alt\u003c/kbd>\u003ckbd>Space\u003c/kbd>\u003c/button>\u003c/div>\u003cdiv class=\"fieldline\">\u003cdiv>\u003ch3>搜索与执行\u003c/h3>\u003cp>方向键选择，回车执行\u003c/p>\u003c/div>\u003ckbd>↑ ↓ ↵\u003c/kbd>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" @click=\"toast='已保留当前快捷键'\">保存快捷键\u003c/button>\u003c/div>\u003c/section>\n\u003csection x-show=\"section==='theme'\" x-cloak>\u003cdiv class=\"eyebrow\">偏好设置\u003c/div>\u003ch1>外观\u003c/h1>\u003cp class=\"intro\">让 Flashcast 适应你的工作环境。\u003c/p>\u003cdiv class=\"themes\">\u003cbutton class=\"theme\" :class=\"{chosen:appearance==='light'}\" @click=\"appearance='light';toast='已选择浅色'\">\u003cdiv class=\"thumb\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003cspan class=\"name\">浅色 \u003cspan class=\"check\">✓\u003c/span>\u003c/span>\u003c/button>\u003cbutton class=\"theme\" :class=\"{chosen:appearance==='dark'}\" @click=\"appearance='dark';toast='已选择深色'\">\u003cdiv class=\"thumb dark\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003cspan class=\"name\">深色 \u003cspan class=\"check\">✓\u003c/span>\u003c/span>\u003c/button>\u003cbutton class=\"theme\" :class=\"{chosen:appearance==='system'}\" @click=\"appearance='system';toast='已选择跟随系统'\">\u003cdiv class=\"thumb system\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003cspan class=\"name\">跟随系统 \u003cspan class=\"check\">✓\u003c/span>\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"fieldline\" style=\"margin-top:17px\">\u003cdiv>\u003ch3>主题插件\u003c/h3>\u003cp>使用本地主题包定制外观\u003c/p>\u003c/div>\u003cbutton class=\"secondary\" disabled>安装主题\u003c/button>\u003c/div>\u003c/section>\n\u003csection x-show=\"section==='memos'\" x-cloak>\u003cdiv class=\"memoheader\">\u003cdiv>\u003cdiv class=\"eyebrow\">数据与内容\u003c/div>\u003ch1>备忘录\u003c/h1>\u003c/div>\u003cbutton class=\"primary\" @click=\"editing=true;draft=''\">新建\u003c/button>\u003c/div>\u003cp class=\"intro\">通过标签快速找到常用内容。\u003c/p>\u003cdiv class=\"memolist\" x-show=\"!editing\">\u003cdiv class=\"memoitem\">\u003cdiv>\u003cstrong>常用回复\u003c/strong>\u003cp x-text=\"saved\">\u003c/p>\u003csmall>回复 · 工作\u003c/small>\u003c/div>\u003cbutton @click=\"editing=true;draft=saved\">编辑\u003c/button>\u003c/div>\u003cdiv class=\"memoitem\">\u003cdiv>\u003cstrong>会议邀请\u003c/strong>\u003cp>下午三点在三楼会议室，麻烦确认一下时间。\u003c/p>\u003csmall>会议 · 工作\u003c/small>\u003c/div>\u003cbutton @click=\"toast='已选择会议邀请'\">编辑\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"editor\" x-cloak x-show=\"editing\">\u003clabel>\u003csmall>标题\u003c/small>\u003cinput aria-label=\"备忘录标题\" value=\"常用回复\">\u003c/label>\u003clabel>\u003csmall>正文\u003c/small>\u003ctextarea aria-label=\"备忘录正文\" x-model=\"draft\">\u003c/textarea>\u003c/label>\u003cdiv class=\"actions\">\u003cbutton class=\"secondary\" @click=\"editing=false\">取消\u003c/button>\u003cbutton class=\"primary\" @click=\"saved=draft;editing=false;toast='已更新常用回复'\">保存\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n\u003csection x-show=\"section==='clipboard'\" x-cloak>\u003cdiv class=\"eyebrow\">数据与内容\u003c/div>\u003ch1>剪贴板历史\u003c/h1>\u003cp class=\"intro\">重新找到复制过的文字、图片和文件。\u003c/p>\u003cdiv class=\"fieldline\">\u003cdiv>\u003ch3>记录剪贴板\u003c/h3>\u003cp x-text=\"paused?'已暂停新内容记录':'正在记录新内容'\">\u003c/p>\u003c/div>\u003cbutton class=\"secondary\" @click=\"paused=!paused\" x-text=\"paused?'继续记录':'暂停记录'\">\u003c/button>\u003c/div>\u003cdiv class=\"fieldline\">\u003cdiv>\u003ch3>保留期限\u003c/h3>\u003cp>到期后自动清理\u003c/p>\u003c/div>\u0  }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;$('#none').hidden=list.length>0;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  $('#notes-toggle').checked=st.notesOn;
  $('#filter-summary').textContent=`比较范围 ${list.length}/${C.length}`;
  $$('#filter-list input').forEach(i=>i.checked=st.visible.includes(i.value));
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”会带上最新备注重新复制，不再有单独的复制按钮
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
   animate($('#decide-name'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:380,easing:ease('glide')});
   animate($('#choice-chip'),[{transform:'scale(.3)'},{transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?'已选择':'已选择 · 复制'):(short?'选择':'选这个方向')));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?'再点一次，带上最新备注重新复制':'选择这个方向，并复制给 Agent';});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
  const c=byId[st.chosen];$('#decide-name').textContent=c?`${no(c)} ${c.name}`:'未选择方向';$('#picked').classList.toggle('on',!!c);
  const chip=$('#choice-chip'),next=c?stripMini(c):el('span','choice-empty');next.id='choice-chip';chip.replaceWith(next);
  status();
 }
 function status(){$('#notes-open').textContent=st.notes?'备注 ·':'备注';const s=$('#state');if(!stored){s.textContent='浏览器存储不可用：关闭页面后选择和备注不会保留。';s.dataset.warn='';}else{s.textContent='备注会和选择一起复制。改完备注，再点一次“已选择”重新复制。';delete s.dataset.warn;}}
 function copyText(){const c=byId[st.chosen];let t=`${DATA.round?DATA.round+'：':''}选 ${no(c)} ${c.name}`;if(st.notes.trim())t+=`\n备注：${st.notes.trim()}`;return t;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,t){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?'已复制，粘贴给 Agent':'复制失败，请手动复制';n.querySelector('code').textContent=ok?t.replace(/\n/g,' · '):t;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 const fl=$('#filter-list');
 C.forEach(c=>{const l=el('label'),i=el('input');i.type='checkbox';i.value=c.id;i.addEventListener('change',()=>{st.visible=C.map(x=>x.id).filter(id=>id===c.id?i.checked:st.visible.includes(id));save();morph(render,'reshape');});l.append(i,el('span','n',no(c)),c.name);fl.append(l);});
 $('#show-all').addEventListener('click',()=>{st.visible=C.map(c=>c.id);save();morph(render,'reshape');});
 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 $('#notes-toggle').addEventListener('change',e=>{st.notesOn=e.target.checked;save();morph(render,'reshape');});
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 const notes=$('#notes');notes.value=st.notes||'';
 notes.addEventListener('input',()=>{st.notes=notes.value;save();status();});
 $('#notes-open').parentElement.addEventListener('toggle',e=>{if(e.target.open)notes.focus();});
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
