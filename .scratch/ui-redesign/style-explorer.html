/* 并排与单张之间、视口与筛选变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */
::view-transition-group(*){animation-duration:var(--glide-d);animation-timing-function:var(--glide)}
::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口、筛选、说明开关和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

);overflow:hidden;\n    box-shadow:0 40px 90px rgba(0,0,0,.68), 0 2px 0 rgba(255,255,255,.02) inset, 0 0 0 1px rgba(0,0,0,.5);\n    animation:winIn .5s cubic-bezier(.22,1,.36,1) both}\n  .window::before{content:\"\";position:absolute;top:0;left:12%;right:12%;height:1px;z-index:3;\n    background:linear-gradient(90deg,transparent,rgba(242,167,107,.55),transparent)}\n  @keyframes winIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}\n  .window[data-closed=\"true\"]{opacity:0;transform:scale(.98);transition:opacity .18s ease,transform .18s ease;pointer-events:none}\n\n  /* ---- 搜索行 ---- */\n  .search{flex:none;display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;border-bottom:1px solid var(--line)}\n  .search .lens{width:17px;height:17px;flex:none;color:var(--accent)}\n  .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);\n    font:500 15px/1 var(--font);caret-color:var(--accent)}\n  .search input::placeholder{color:var(--dim)}\n  .hint-key{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:11.5px;white-space:nowrap}\n  .scope{flex:none;font-size:11.5px;color:var(--accent);padding:3px 9px;border-radius:999px;\n    background:var(--accent-soft);border:1px solid var(--accent-line)}\n  .gear{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;color:var(--muted);\n    border:1px solid transparent;background:transparent;cursor:pointer}\n  .gear:hover{color:var(--text);border-color:var(--line)}\n\n  /* ---- 结果列表 ---- */\n  .list{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 8px 10px;overscroll-behavior:contain}\n  .band{position:absolute;left:8px;right:8px;height:56px;border-radius:var(--r-row);z-index:0;pointer-events:none;\n    background:linear-gradient(90deg,var(--accent-soft),rgba(242,167,107,.015) 62%,transparent);\n    border:1px solid var(--accent-line);\n    transform:translateY(var(--band-y,0));\n    transition:transform .3s cubic-bezier(.22,1,.36,1),height .2s ease,background .25s}\n  .band::before{content:\"\";position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:3px;height:24px;border-radius:3px;\n    background:linear-gradient(180deg,var(--accent-hi),var(--accent));box-shadow:0 0 14px rgba(242,167,107,.55)}\n  .row{position:relative;z-index:1;display:flex;align-items:center;gap:13px;height:56px;padding:0 14px;border-radius:var(--r-row);\n    border:1px solid transparent;cursor:default;user-select:none;\n    animation:rowIn .4s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i) * 42ms + 90ms)}\n  @keyframes rowIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}\n  .row:hover{background:rgba(255,255,255,.035)}\n  .row[data-selected=\"true\"]{border-color:var(--accent-line)}\n  .row[data-selected=\"true\"] .title{color:#fff}\n  .row.pulse{animation:pulse .34s ease}\n  @keyframes pulse{0%{transform:scale(1)}35%{transform:scale(.985)}100%{transform:scale(1)}}\n  .tile{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;\n    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);color:var(--muted);overflow:hidden}\n  .tile svg{width:19px;height:19px}\n  .txt{display:flex;flex-direction:column;gap:3px;min-width:0}\n  .title{font-size:14.5px;font-weight:500;letter-spacing:.005em;color:#dcdee6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .sub .sep{color:var(--dim);margin:0 6px}\n  .tag{display:inline-block;font-size:10.5px;color:var(--accent);background:var(--accent-soft);\n    border:1px solid var(--accent-line);border-radius:5px;padding:0 5px;margin-right:5px;vertical-align:1px}\n  .type{position:absolute;left:14px;top:50%;transform:translateY(-50%);\n\n  }\n  .empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px}\n  .empty b{display:block;color:var(--text);font-weight:500;font-size:14px;margin-bottom:5px}\n\n  /* ---- 预览条 ---- */\n  .preview{flex:none;border-top:1px solid var(--line);background:rgba(255,255,255,.018);\n    padding:11px 18px 13px;max-height:172px;overflow:auto}\n  .preview[hidden]{display:none}\n  .preview-head{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}\n  .preview-title{font-size:12.5px;font-weight:600;color:var(--text)}\n  .preview-meta{font-size:11.5px;color:var(--dim);font-family:var(--mono)}\n  .preview-kind{margin-left:auto;font-size:11px;color:var(--accent)}\n  .preview-body{margin:0;font:400 13px/1.7 var(--font);color:#c9ccd6;white-space:pre-wrap;word-break:break-word}\n\n  /* ---- 操作栏 ---- */\n  .action{flex:none;display:flex;align-items:center;gap:16px;height:40px;padding:0 16px;border-top:1px solid var(--line);\n    font-size:11.5px;color:var(--muted)}\n  .akey{display:inline-flex;align-items:center;gap:5px}\n  kbd{font-family:var(--mono);font-size:10.5px;color:#c9ccd6;background:rgba(255,255,255,.06);\n    border:1px solid var(--line-strong);border-bottom-color:rgba(0,0,0,.5);border-radius:5px;padding:1px 5px;min-width:18px;text-align:center}\n  .count{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}\n  .toast{position:absolute;left:50%;bottom:54px;transform:translateX(-50%) translateY(6px);z-index:5;\n    font-size:12px;color:var(--text);background:rgba(30,32,38,.96);border:1px solid var(--accent-line);\n    border-radius:9px;padding:6px 13px;box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}\n  .toast[data-on=\"true\"]{opacity:1;transform:translateX(-50%) translateY(0)}\n  .recall{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);font-size:12px;color:var(--muted)}\n  .recall[hidden]{display:none}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"scene\" x-data=\"launcher()\" x-init=\"init()\" @keydown.window=\"key($event)\" @click=\"closed=false\">\n  \u003cdiv class=\"window\" :data-closed=\"closed\" data-testid=\"window\">\n    \u003c!-- 搜索行 -->\n    \u003cdiv class=\"search\">\n      \u003csvg class=\"lens\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\">\n        \u003ccircle cx=\"9\" cy=\"9\" r=\"5.6\"/>\u003cpath d=\"M13.2 13.2 17 17\"/>\n      \u003c/svg>\n      \u003cinput x-model=\"q\" @input=\"onType()\" placeholder=\"搜索软件、备忘录、剪贴板…\" aria-label=\"搜索\" />\n      \u003cspan class=\"hint-key\" x-show=\"!q\">输入即搜\u003c/span>\n      \u003cspan class=\"scope\" data-testid=\"scope\">首屏\u003c/span>\n      \u003cbutton class=\"gear\" title=\"设置\" aria-label=\"设置\">\n        \u003csvg viewBox=\"0 0 20 20\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\">\n          \u003ccircle cx=\"10\" cy=\"10\" r=\"2.6\"/>\n          \u003cpath d=\"M10 2.6v2M10 15.4v2M17.4 10h-2M4.6 10h-2M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4M15.2 15.2l-1.4-1.4M6.2 6.2 4.8 4.8\"/>\n        \u003c/svg>\n      \u003c/button>\n    \u003c/div>\n\n    \u003c!-- 结果 -->\n    \u003cdiv class=\"list\" x-ref=\"list\">\n      \u003cdiv class=\"band\" :style=\"'--band-y:'+bandY+'px;height:'+bandH+'px'\">\u003c/div>\n\n      \u003c!-- 命令 -->\n      \u003cdiv class=\"row\" data-i=\"0\" data-search=\"重新扫描软件 命令 刷新已安装软件列表\" :data-selected=\"sel===0\" @click.stop=\"select(0)\" @mouseenter=\"select(0)\">\n        \u003cspan class=\"tile\">\u003csvg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 6l4 4-4 4M11 15h4\"/>\u003c/svg>\u003c/span>\n        \u003cspan class=\"txt\">\u003cspan class=\"title\">重新扫描软件\u003c/span>\u003cspan class=\"sub\">\u003cspan class=\"tag\">命令\u003c/span>刷新已安装软件列表\u003c/span>\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"row\" data-i=\"1\" data-search=\"查看平台能力 命令 会话类型 权限状态\" :data-selected=\"sel===1\" @click.stop=\"select(1)\" @mouseenter=\"select(1)\">\n        \u003cspan class=\"tile\">\u003csvg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\">\u003ccircle cx=\"10\" cy=\"10\" r=\"7\"/>\u003cpath d=\"M10 6.4v4.2l2.6 1.6\"/>\u003c/svg>\u003c/span>\n        \u003cspan class=\"txt\">\u003cspan class=\"title\">查看平台能力\u003c/span>\u003cspan class=\"sub\">\u003cspan class=\"tag\">命令\u003c/span>会话类型与各能力的真实支持状态\u003c/span>\u003c/span>\n      \u003c/div>\n\n      \u003c!-- 备忘录（默认选中：展示预览） -->\n      \u003cdiv class=\"row\" data-i=\"2\" data-search=\"常用回复 备忘录 memo 回复 工作\" :data-selected=\"sel===2\" @click.stop=\"select(2)\" @mouseenter=\"select(2)\">\n        \u003cspan class=\"tile\" style=\"color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)\">\n          \u003csvg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 3.5h7l3 3v10H5z\"/>\u003cpath d=\"M7.5 9h5M7.5 12h3.5\"/>\u003c/svg>\n        \u003c/span>\n        \u003cspan class=\"txt\">\u003cspan class=\"title\">常用回复\u003c/span>\u003cspan class=\"sub\">\u003cspan class=\"tag\">回复\u003c/span>\u003cspan class=\"tag\">工作\u003c/span>备忘录 · 2 个标签\u003c/span>\u003c/span>\n      \u003c/div>\n\n      \u003c!-- 剪贴板 -->\n      \u003cdiv class=\"row\" data-i=\"3\" data-search=\"会议纪要草稿 上午十点在三楼会议室 剪贴板 clipboard 文字 HTML Firefox\" :data-selected=\"sel===3\" @click.stop=\"select(3)\" @mouseenter=\"select(3)\">\n        \u003cspan class=\"tile\" style=\"background:#2b2440;border-color:rgba(255,255,255,.12);color:#c3aef2\">\n          \u003csvg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"5\" y=\"4.5\" width=\"10\" height=\"12\" rx=\"1.6\"/>\u003cpath d=\"M8 4.5V3.2h4v1.3M7.5 9h5M7.5 12h3\"/>\u003c/svg>\n        \u003c/span>\n        \u003cspan class= , "palette": ["#f6f1e7", "#fffdf8", "#b4472f"], "traits": ["暖纸 + 赭红墨线", "结果按来源分节编号", "带横线的索引卡预览"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline' 'unsafe-eval'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cscript>(()=>{const mem=()=>{const m=new Map();return{get length(){return m.size},key:i=>[...m.keys()][i]??null,getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v))},removeItem:k=>{m.delete(String(k))},clear:()=>m.clear()}};for(const n of['localStorage','sessionStorage']){try{window[n].length}catch{Object.defineProperty(window,n,{value:mem(),configurable:true})}}})();\u003c/script>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n\u003ctitle>02 纸页 Paper Index\u003c/title>\n\u003cstyle>\n  :root{\n    --desk:#e9e0cd;\n    --paper:#fbf7ee;\n    --card:#fffdf8;\n    --ink:#24211b;\n    --muted:#736c5c;\n    --dim:#a49b87;\n    --rule:#d9cfb8;\n    --rule-strong:#c3b696;\n    --accent:#b4472f;\n    --accent-soft:rgba(180,71,47,.08);\n    --green:#3f6b52;\n    --r:6px;\n    --serif:\"Noto Serif CJK SC\",\"Songti SC\",\"Source Han Serif SC\",serif;\n    --sans:\"OPPO Sans 4.0\",\"Noto Sans CJK SC\",system-ui,-apple-system,sans-serif;\n    --mono:\"Noto Sans Mono CJK SC\",\"Noto Sans Mono\",ui-monospace,monospace;\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%}\n  body{font-family:var(--sans);background:var(--desk);color:var(--ink);-webkit-font-smoothing:antialiased}\n\n  /* 场景：暖纸书桌 */\n  .scene{position:relative;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:40px;overflow:hidden;\n    background:\n      radial-gradient(70% 60% at 50% 0%, #f3ecdd, transparent 70%),\n      radial-gradient(60% 50% at 80% 100%, rgba(180,71,47,.06), transparent 70%),\n      var(--desk);}\n  .scene::after{content:\"\";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;\n    background-image:repeating-linear-gradient(0deg, rgba(120,105,80,.05) 0 1px, transparent 1px 3px);}\n\n  /* 窗口：一张叠在书桌上的索引册 */\n  .window{position:relative;width:700px;max-width:100%;height:470px;display:flex;flex-direction:column;\n    background:var(--paper);border:1px solid var(--rule-strong);border-radius:var(--r);overflow:hidden;\n    box-shadow:6px 8px 0 rgba(60,50,32,.10), 0 22px 50px rgba(60,50,32,.16);\n    animation:winIn .45s cubic-bezier(.22,1,.36,1) both}\n  @keyframes winIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n  .window[data-closed=\"true\"]{opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;pointer-events:none}\n  /* 书脊：左侧一条窄边，像册子 */\n  .window::before{content:\"\";position:absolute;left:0;top:0;bottom:0;width:6px;z-index:4;\n    background:linear-gradient(90deg,var(--accent),#8f3521);opacity:.9}\n\n  /* 头部：下划线式搜索行 */\n  .head{padding:15px 22px 12px 26px;border-bottom:1px solid var(--rule)}\n  .kicker{display:flex;align-items:center;gap:8px;font:600 10.5px/1 var(--mono);letter-spacing:.16em;\n    text-transform:uppercase;color:var(--accent);margin-bottom:8px}\n  .kicker .ln{flex:1;height:1px;background:var(--rule)}\n  .searchline{display:flex;align-items:baseline;gap:12px}\n  .searchline .qmark{font-family:var(--serif);font-size:22px;color:var(--accent);line-height:1;transform:translateY(2px)}\n  .searchline input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);\n    font:400 19px/1.2 var(--serif);letter-spacing:.01em;caret-color:var(--accent);padding:2px 0}\n  .searchline input::placeholder{color:var(--dim)}\n  .scope{flex:none;font:600 10.5px/1 var(--mono);letter-spacing:.12em;color:var(--muted);\n    border:1px solid var(--rule-strong);border-radius:3px;padding:4px 8px;text-transform:uppercase}\n\n  /* 列表 */\n  .list{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 0 8px}\n  .marker{position:absolute;left:0;width:4px;height:26px;z-index:0;background:var(--accent);border-radius:0 2px 2px 0;\n    transform:translateY(var(--mk-y,0));transition:transform .28s cubic-bezier(.22,1,.36,1),height .2s}\n  .sec{padding:9px 26px 4px;display:flex;align-items:baseline;gap:9px}\n  .sec .no{font:600 10.5px/1 var(--mono);color:var(--accent);letter-spacing:.06em}\n  .sec .nm{font:600 11px/1 var(--sans);color:var(--muted);letter-spacing:.16em}\n  .sec .rule{flex:1;height:1px;background:var(--rule);transform:translateY(-3px)}\n  .sec .n{font:10.5px/1 var(--mono);color:var(--dim)}\n  .row{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:7px 26px 7px 26px;min-height:46px;\n    cursor:default;user-select:none;border-left:4px solid transparent;\n    animation:writeIn .42s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i) * 38ms + 80ms)}\n  @keyframes writeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}\n  .row:hover{background:rgba(36,33,27,.035)}\n  .row[data-selected=\"true\"]{background:var(--accent-soft)}\n  .row.pulse{animation:stamp .3s ease}\n  @keyframes stamp{0%{transform:translateY(0)}40%{transform:translateY(1px) scale(.995)}100%{transform:none}}\n  .row .fold{position:absolute;left:8px;top:50%;transform:translateY(-50%) scale(.4);opacity:0;color:var(--accent);\n    font-size:15px;transition:opacity .2s,transform .2s}\n  .row[data-selected=\"true\"] .fold{opacity:1;transform:translateY(-50%) scale(1)}\n  .r-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}\n  .title{font:400 15.5px/1.3 var(--serif);color:#2b271f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .row[data-selected=\"true\"] .title{color:#1a1710}\n  .sub{font:400 11.5px/1.3 var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .glean{font:400 10.5px/1 var(--mono);color:var(--dim);flex:none;letter-spacing:.02em}\n  .empty{padding:40px 20px;text-align:center;color:var(--muted)}\n  .empty b{display:block;font:400 17px/1.4 var(--serif);color:var(--ink);margin-bottom:6px}\n\n  /* 预览：一张带横线的索引卡 */\n  .preview{flex:none;margin:4px 14px 8px 26px;background:var(--card);border:1px solid var(--rule-strong);border-radius:4px;\n    box-shadow:2px 2px 0 rgba(60,50,32,.07);max-height:150px;overflow:auto}\n  .preview[hidden]{display:none}\n  .ph{display:flex;align-items:baseline;gap:10px;padding:9px 14px 7px;border-bottom:1px solid var(--rule)}\n  .ph .pt{font:600 13px/1.2 var(--serif);color:var(--ink)}\n  .ph .pm{font:10.5px/1 var(--mono);color:var(--dim)}\n  .ph .pk{margin-left:auto;font:600 10px/1 var(--mono);letter-spacing:.1em;color:var(--accent)}\n  .pbody{margin:0;padding:10px 14px;font:400 12.5px/21px var(--sans);color:#3a352b;white-space:pre-wrap;word-break:break-word;\n    background-image:repeating-linear-gradient(180deg,transparent 0 20px, rgba(217,207,184,.55) 20px 21px)}\n\n  /* 操作栏 */\n  .action{flex:none;display:flex;align-items:center;gap:18px;height:38px;padding:0 22px 0 26px;border-top:1px solid var(--rule);\n    font:400 11px/1 var(--sans);color:var(--muted);letter-spacing:.02em}\n  .akey{display:inline-flex;align-items:center;gap:6px}\n  kbd{font:10px/1 var(--mono);color:var(--ink);border:1px solid var(--rule-strong);border-radius:3px;padding:2px 5px;background:var(--card)}\n  .count{margin-left:auto;font:10.5px/1 var(--mono);color:var(--dim)}\n  .toast{position:absolute;left:50%;bottom:52px;transform:translateX(-50%) translateY(6px);z-index:6;\n    font:12px/1 var(--sans);color:var(--paper);background:var(--accent);border-radius:4px;padding:7px 14px;\n    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 10px 24px rgba(120,50,30,.3)}\n  .toast[data-on=\"true\"]{opacity:1;transform:translateX(-50%) translateY(0)}\n  .recall{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);font:12px/1 var(--sans);color:#6b6250}\n  .recall[hidden]{display:none}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"scene\" x-data=\"launcher()\" x-init=\"init()\" @keydown.window=\"key($event)\" @click=\"closed=false\">\n  \u003cdiv class=\"window\" :data-closed=\"closed\" data-testid=\"window\">\n    \u003cheader class=\"head\">\n      \u003cdiv class=\"kicker\">\u003cspan>Flashcast Index\u003c/span>\u003cspan class=\"ln\">\u003c/span>\u003cspan x-text=\"countLabel\">9 条\u003c/span>\u003c/div>\n      \u003cdiv class=\"searchline\">\n        \u003cspan class=\"qmark\">⌕\u003c/span>\n        \u003cinput x-model=\"q\" @input=\"onType()\" placeholder=\"输入要查找的条目…\" aria-label=\"搜索\" />\n        \u003cspan class=\"scope\">首屏\u003c/span>\n      \u003c/div>\n    \u003c/header>\n\n    \u003cdiv class=\"list\" x-ref=\"list\">\n      \u003cdiv class=\"marker\" :style=\"'--mk-y:'+mkY+'px'\">\u003c/div>\n\n      \u003cdiv class=\"sec\">\u003cspan class=\"no\">01\u003c/span>\u003cspan class=\"nm\">命令\u003c/span>\u003cspan class=\"rule\">\u003c/span>\u003cspan class=\"n\">2\u003c/span>\u003c/div>\n      \u003cdiv class=\"row\" data-i=\"0\" data-search=\"重新扫描软件 命令 刷新已安装软件列表\" :data-selected=\"sel===0\" @click.stop=\"select(0)\" @mouseenter=\"select(0)\">\n        \u003cspan class=\"fold\">◤\u003c/span>\n        \u003cspan class=\"r-main\">\u003cspan class=\"title\">重新扫描软件\u003c/span>\u003cspan class=\"sub\">刷新已安装软件列表\u003c/span>\u003c/span>\n        \u003cspan class=\"glean\">命令\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"row\" data-i=\"1\" data-search=\"查看平台能力 命令 会话类型 权限状态\" :data-selected=\"sel===1\" @click.stop=\"select(1)\" @mouseenter=\"select(1)\">\n        \u003cspan class=\"fold\">◤\u003c/span>\n        \u003cspan class=\"r-main\">\u003cspan class=\"title\">查看平台能力\u003c/span>\u003cspan class=\"sub\">会话类型与各能力的真实支持状态\u003c/span>\u003c/span>\n        \u003cspan class=\"glean\">命令\u003c/span>\n      \u003c/div>\n\n      \u003cdiv class=\"sec\">\u003cspan class=\"no\">02\u003c/span>\u003cspan class=\"nm\">备忘录\u003c/span>\u003cspan class=\"rule\">\u003c/span>\u003cspan class=\"n\">1\u003c/span>\u003c/div>\n      \u003cdiv class=\"row\" data-i=\"2\" data-search=\"常用回复 备忘录 memo 回复 工作\" :data-selected=\"sel===2\" @click.stop=\"select(2)\" @mouseenter=\"select(2)\">\n        \u003cspan class=\"fold\">◤\u003c/span>\n        \u003cspan class=\"r-main\">\u003cspan class=\"title\">常用回复\u003c/span>\u003cspan class=\"sub\">标签 · 回复、工作\u003c/span>\u003c/span>\n        \u003cspan class=\"glean\">memo\u003c/span>\n      \u003c/div>\n\n      \u003cdiv class=\"sec\">\u003cspan class=\"no\">03\u003c/span>\u003cspan class=\"nm\">剪贴板\u003c/span>\u003cspan class=\"rule\">\u003c/span>\u003cspan class=\"n\">1\u003c/span>\u003c/div>\n      \u003cdiv class=\"row\" data-i=\"3\" data-search=\"会议纪要草稿 上午十点在三楼会议室 剪贴板 clipboard 文字 HTML Firefox\" :data-selected=\"sel===3\" @click.stop=\"select(3)\" @mouseenter=\"select(3)\">\n        \u003cspan class=\"fold\">◤\u003c/span>\n        \u003cspan class=\"r-main\">\u003cspan class=\"title\">会议纪要草稿 上午十点在三楼会议室\u003c/span>\u003cspan class=\"sub\">文字、HTML · 来自 Firefox\u003c/span>\u003c/span>\n        \u003cspan class=\"glean\">clip\u003c/span>\n      \u003c/div>\n\n      \u003cdiv class=\"sec\">\u003cspan class=\"no\">04\u003c/span>\u003cspan class=\"nm\">书签\u003c/span>\u003cspan class=\"rule\">\u003c/span>\u003cspan class=\"n\">1\u003c/span>\u003c/div>\n      \u003cdiv class=\"row\" data-i=\"4\" data-search=\"Rust 文档 书签 chrome bookmark doc.rust-lang.org\" :data-selected=\"sel===4\" @click.stop=\"select(4)\" @mouseenter=\"select(4)\">\n        \u003cspan class=\"fold\">◤\u003c/span>\n        \u003cspan class=\"r-main\">\u003cspan class=\"title\">Rust 文档\u003c/span>\u003cspan class=\"sub\">doc.rust-lang.org/std · 书签栏 / 开发\u003c/span>\u003c/span>\n        \u003cspan class=\"glean\">www\u003c/span>\n      \u003c/div>\n\n      \u003cdiv class=\"sec\">\u003cspan class=\"no\">05\u003c/span>\u003cspan class=\"nm\">软件\u003c/span>\u003cspan class=\"rule\">\u003c/span>\u003cspan class=\"n\">4\u003c/span>\u003c/div>\n      \u003cdiv class=\"row\" data-i=\"5\" data-search=\"Firefox 浏览器 browser web 软件 浏览网页\" :data-selected=\"sel===5\" @click.stop=\"select(5)\" @mouseenter=\"select(5)\">\n        \u003cspan class=\"fold\">◤\u003c/span>\n        \u003cspan class=\"r-main\">\u003cspan class=\"title\">Firefox 浏览器\u003c/span>\u003cspan class=\"sub\">浏览网页\u003c/span>\u003c/span>\n        \u003cspan class=\"glean\">app\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"row\" data-i=\"6\" data-search=\"Visual Studio Code 代码编辑器 软件 editor code\" :data-selected=\"sel===6\" @click.stop=\"select(6)\" @mouseenter=\"select(6)\">\n        \u003cspan class=\"fold\">◤\u003c/span>\n        \u003cspan class=\"r-main\">\u003cspan class=\"title\">Visual Studio Code\u003c/span>\u003cspan class=\"sub\">代码编辑器\u003c/span>\u003c/span>\n        \u003cspan class=\"glean\">app\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"row\" data-i=\"7\" data-search=\"终端 terminal shell 命令行 软件\" :data-selected=\"sel===7\" @click.stop=\"select(7)\" @mouseenter=\"select(7)\">\n        \u003cspan class=\"fold\">◤\u003c/span>\n        \u003cspan class=\"r-main\">\u003cspan class=\"title\">终端\u003c/span>\u003cspan class=\"sub\">命令行\u003c/span>\u003c/span>\n        \u003cspan class=\"glean\">app\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"row\" data-i=\"8\" data-search=\"文件 files nautilus 浏览本地文件 软件\" :data-selected=\"sel===8\" @click.stop=\"select(8)\" @mouseenter=\"select(8)\">\n        \u003cspan class=\"fold\">◤\u003c/span>\n        \u003cspan class=\"r-main\">\u003cspan class=\"title\">文件\u003c/span>\u003cspan class=\"sub\">浏览本地文件\u003c/span>\u003c/span>\n        \u003cspan class=\"glean\">app\u003c/span>\n      \u003c/div>\n    \u003c/div>\n\n    \u003csection class=\"preview\" :hidden=\"!showPreview\" data-testid=\"preview\">\n      \u003cdiv class=\"ph\">\n        \u003cspan class=\"pt\" x-text=\"pTitle\">常用回复\u003c/span>\n        \u003cspan class=\"pm\" x-text=\"pMeta\">备忘录 · 2 个标签\u003c/span>\n        \u003cspan class=\"pk\" x-text=\"pKind\">完整内容\u003c/span>\n      \u003c/div>\n      \u003cpre class=\"pbody\" x-text=\"pBody\">收到，我看一下再回复你。\n会议纪要和补充材料我已上传到共享盘，链接在下方。\u003c/pre>\n    \u003c/section>\n\n    \u003cfooter class=\"action\">\n      \u003cspan class=\"akey\">\u003ckbd>↑\u003c/kbd>\u003ckbd>↓\u003c/kbd> 选择\u003c/span>\n      \u003cspan class=\"akey\">\u003ckbd>↵\u003c/kbd> \u003cspan data-testid=\"action-label\" x-text=\"actionLabel\">粘贴\u003c/span>\u003c/span>\n      \u003cspan class=\"akey\">\u003ckbd>esc\u003c/kbd> 关闭\u003c/span>\n      \u003cspan class=\"count\" x-text=\"countLabel\">9 条结果\u003c/span>\n    \u003c/footer>\n    \u003cdiv class=\"toast\" :data-on=\"toast!==''\" x-text=\"toast\">\u003c/div>\n  \u003c/div>\n  \u003cp class=\"recall\" :hidden=\"!closed\">窗口已关闭 · 点击任意处唤起\u003c/p>\n\u003c/div>\n\n\n\u003cscript>\nfunction launcher(){\n  return {\n    sel:2, mkY:0, q:'', toast:'', closed:false, showPreview:true,\n    pTitle:'常用回复', pMeta:'备忘录 · 2 个标签', pKind:'完整内容',\n    pBody:'收到，我看一下再回复你。\\n会议纪要和补充材料我已上传到共享盘，链接在下方。',\n    actionLabel:'粘贴',\n    get countLabel(){ return this.rows().filter(r=>this.match(r)).length + ' 条结果'; },\n    rows(){ return this.$refs.list ? Array.from(this.$refs.list.querySelectorAll('.row')) : []; },\n    match(row){ return !this.q || row.dataset.search.toLowerCase().includes(this.q.toLowerCase()); },\n    visible(){ return this.rows().filter(r=>this.match(r)); },\n    init(){\n      const s=new URLSearchParams(location.search).get('state');\n      if(s==='home') this.sel=0;\n      if(s==='empty'){ this.q='zzz'; this.sel=-1; }\n      this.$nextTick(()=>{ if(this.sel\u003c0){const v=this.visible();this.sel=v.length?Number(v[0].dataset.i):-1;} this.place(); });\n    },\n    place(){\n      this.rows().forEach(r=>{ r.style.display=this.match(r)?'': % 110%,rgba(79,209,181,.10),transparent 70%)}\n\n  /* 窗口：仪器面板 */\n  .window{position:relative;width:700px;max-width:100%;height:470px;display:flex;flex-direction:column;\n    background:var(--panel);border:1px solid #263537;border-radius:var(--r);overflow:hidden;\n    box-shadow:0 0 0 1px #050808, 0 30px 70px rgba(0,0,0,.7), inset 0 0 60px rgba(79,209,181,.03);\n    animation:winIn .38s cubic-bezier(.22,1,.36,1) both}\n  @keyframes winIn{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}\n  .window[data-closed=\"true\"]{opacity:0;transform:scale(.985);transition:.16s;pointer-events:none}\n  .scan{position:absolute;left:0;right:0;height:54px;top:44px;z-index:3;pointer-events:none;\n    background:linear-gradient(180deg,transparent,rgba(79,209,181,.13),transparent);\n    animation:sweep 1.8s cubic-bezier(.4,0,.2,1) .15s 1 both}\n  @keyframes sweep{0%{transform:translateY(-40px);opacity:0}12%{opacity:1}100%{transform:translateY(340px);opacity:0}}\n\n  /* 仪器状态栏 */\n  .statusbar{flex:none;display:flex;align-items:center;gap:14px;height:34px;padding:0 14px;\n    border-bottom:1px solid var(--line);background:var(--panel-2);font-size:10.5px;line-height:1;letter-spacing:.06em;color:var(--muted)}\n  .brand{color:var(--pri);font-weight:600;letter-spacing:.18em}\n  .statusbar .cell{display:inline-flex;gap:6px;align-items:center}\n  .statusbar .k{color:var(--dim)}\n  .statusbar .v{color:var(--text)}\n  .dot{width:6px;height:6px;border-radius:50%;background:var(--pri);box-shadow:0 0 8px var(--pri);display:inline-block}\n  .statusbar .right{margin-left:auto;display:inline-flex;gap:12px;align-items:center}\n\n  /* 提示符搜索行 */\n  .prompt{flex:none;display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-bottom:1px solid var(--line)}\n  .prompt .p{color:var(--pri);font-size:14px}\n  .prompt input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);\n    font:400 14px/1 var(--mono);caret-color:var(--pri);letter-spacing:.01em}\n  .prompt input::placeholder{color:var(--dim)}\n  .prompt .scope{flex:none;font-size:10.5px;color:var(--amber);border:1px solid rgba(240,180,90,.35);border-radius:2px;padding:3px 7px}\n\n  /* 结果 */\n  .list{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 0 8px}\n  .cursor{position:absolute;left:0;top:0;width:2px;height:30px;background:var(--pri);box-shadow:0 0 10px var(--pri);\n    transform:translateY(var(--cur-y,0));transition:transform .24s cubic-bezier(.22,1,.36,1),height .2s}\n  .row{position:relative;z-index:1;display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:12px;\n    min-height:40px;padding:4px 16px 4px 18px;cursor:default;user-select:none;\n    animation:printIn .36s steps(6,jump-none) both;animation-delay:calc(var(--i) * 34ms + 90ms)}\n  @keyframes printIn{from{opacity:0}to{opacity:1}}\n  .row:hover{background:rgba(79,209,181,.05)}\n  .row[data-selected=\"true\"]{background:var(--pri-soft)}\n  .row[data-selected=\"true\"] .title{color:#eafffb}\n  .row.pulse{animation:blip .3s ease}\n  @keyframes blip{0%{background:var(--pri-soft)}30%{background:rgba(79,209,181,.35)}100%{background:var(--pri-soft)}}\n  .glyph{font-size:13px;color:var(--muted);text-align:center}\n  .row[data-selected=\"true\"] .glyph{color:var(--pri)}\n  .r-main{display:flex;flex-direction:column;gap:1px;min-width:0}\n  .title{font-size:13.5px;line-height:1.35;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .sub{font-size:11px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .meta{font-size:10.5px;color:var(--dim);white-space:nowrap;letter-spacing:.04em}\n  .row[data-selected=\"true\"] .meta{color:var(--amber)}\n  .empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:12.5px;line-height:2}\n  .empty .big{color:var(--text);font-size:13.5px}\n\n  /* 预览：数据块 */\n  .preview{flex:none;margin:2px 12px 8px;border:1px solid var(--line);background:#0b1113;max-height:150px;overflow:auto;\n    border-radius:2px}\n  .preview[hidden]{display:none}\n  .pv-h{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:11px}\n  .pv-h .a{color:var(--pri)}\n  .pv-h .t{color:var(--text)}\n  .pv-h .m{color:var(--dim)}\n  .pv-h .badge{margin-left:auto;color:var(--amber);letter-spacing:.08em}\n  .pv-b{margin:0;padding:9px 12px;font:400 12px/1.75 var(--mono);color:#a9c3c0;white-space:pre-wrap;word-break:break-word}\n\n  /* 信号条 */\n  .signalbar{flex:none;display:flex;align-items:center;gap:18px;height:36px;padding:0 14px;border-top:1px solid var(--line);\n    background:var(--panel-2);font-size:10.5px;color:var(--muted);letter-spacing:.04em}\n  .sig{display:inline-flex;align-items:center;gap:7px}\n  .sig b{color:var(--text);font-weight:400}\n  .sig .key{color:var(--pri)}\n  .meter{margin-left:auto;display:inline-flex;align-items:flex-end;gap:2px;height:12px}\n  .meter i{display:block;width:3px;background:var(--pri);opacity:.75}\n  .toast{position:absolute;left:50%;bottom:50px;transform:translateX(-50%) translateY(6px);z-index:6;\n    font:11.5px/1 var(--mono);color:#04110e;background:var(--pri);border-radius:2px;padding:7px 13px;\n    opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;box-shadow:0 0 24px rgba(79,209,181,.45)}\n  .toast[data-on=\"true\"]{opacity:1;transform:translateX(-50%) translateY(0)}\n  .recall{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);font-size:12px;color:var(--muted)}\n  .recall[hidden]{display:none}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"scene\" x-data=\"launcher()\" x-init=\"init()\" @keydown.window=\"key($event)\" @click=\"closed=false\">\n  \u003cdiv class=\"window\" :data-closed=\"closed\" data-testid=\"window\">\n    \u003cdiv class=\"scan\">\u003c/div>\n\n    \u003c!-- 仪器状态栏 -->\n    \u003cdiv class=\"statusbar\">\n      \u003cspan class=\"brand\">FLASHCAST\u003c/span>\n      \u003cspa span class=\"r-main\">\u003cspan class=\"title\">Visual Studio Code\u003c/span>\u003cspan class=\"sub\">代码编辑器\u003c/span>\u003c/span>\n        \u003cspan class=\"meta\">APP\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"row\" data-i=\"7\" data-search=\"终端 terminal shell 命令行 软件\" :data-selected=\"sel===7\" @click.stop=\"select(7)\" @mouseenter=\"select(7)\">\n        \u003cspan class=\"glyph\">»\u003c/span>\n        \u003cspan class=\"r-main\">\u003cspan class=\"title\">终端\u003c/span>\u003cspan class=\"sub\">命令行\u003c/span>\u003c/span>\n        \u003cspan class=\"meta\">APP\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"row\" data-i=\"8\" data-search=\"文件 files nautilus 浏览本地文件 软件\" :data-selected=\"sel===8\" @click.stop=\"select(8)\" @mouseenter=\"select(8)\">\n        \u003cspan class=\"glyph\">»\u003c/span>\n        \u003cspan class=\"r-main\">\u003cspan class=\"title\">文件\u003c/span>\u003cspan class=\"sub\">浏览本地文件\u003c/span>\u003c/span>\n        \u003cspan class=\"meta\">APP\u003c/span>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 预览 -->\n    \u003csection class=\"preview\" :hidden=\"!showPreview\" data-testid=\"preview\">\n      \u003cdiv class=\"pv-h\">\u003cspan class=\"a\">▤\u003c/span>\u003cspan class=\"t\" x-text=\"pTitle\">常用回复\u003c/span>\u003cspan class=\"m\" x-text=\"pMeta\">MEMO · 2 TAGS\u003c/span>\u003cspan class=\"badge\" x-text=\"pKind\">READOUT\u003c/span>\u003c/div>\n      \u003cpre class=\"pv-b\" x-text=\"pBody\">收到，我看一下再回复你。\n会议纪要和补充材料我已上传到共享盘，链接在下方。\u003c/pre>\n    \u003c/section>\n\n    \u003c!-- 信号条 -->\n    \u003cfooter class=\"signalbar\">\n      \u003cspan class=\"sig\">\u003cspan class=\"key\">↑↓\u003c/span> 扫描\u003c/span>\n      \u003cspan class=\"sig\">\u003cspan class=\"key\">ENTER\u003c/span> ▸ \u003cb data-testid=\"action-label\" x-text=\"actionLabel\">粘贴\u003c/b>\u003c/span>\n      \u003cspan class=\"sig\">\u003cspan class=\"key\">ESC\u003c/span> 关闭\u003c/span>\n      \u003cspan class=\"meter\">\u003ci style=\"height:5px\">\u003c/i>\u003ci style=\"height:8px\">\u003c/i>\u003ci style=\"height:11px\">\u003c/i>\u003ci style=\"height:7px\">\u003c/i>\u003ci style=\"height:10px\">\u003c/i>\u003ci style=\"height:5px\">\u003c/i>\u003ci style=\"height:9px\">\u003c/i>\u003c/span>\n    \u003c/footer>\n    \u003cdiv class=\"toast\" :data-on=\"toast!==''\" x-text=\"toast\">\u003c/div>\n  \u003c/div>\n  \u003cp class=\"recall\" :hidden=\"!closed\">窗口已关闭 · 点击任意处唤起\u003c/p>\n\u003c/div>\n\n\n\u003cscript>\nfunction launcher(){\n  return {\n    sel:2, curY:0, curH:40, q:'', toast:'', closed:false, showPreview:true, scope:'首屏',\n    pTitle:'常用回复', pMeta:'MEMO · 2 TAGS', pKind:'READOUT',\n    pBody:'收到，我看一下再回复你。\\n会议纪要和补充材料我已上传到共享盘，链接在下方。',\n    actionLabel:'粘贴',\n    get countLabel(){ return this.rows().filter(r=>this.match(r)).length; },\n    rows(){ return this.$refs.list ? Array.from(this.$refs.list.querySelectorAll('.row')) : []; },\n    match(row){ return !this.q || row.dataset.search.toLowerCase().includes(this.q.toLowerCase()); },\n    visible(){ return this.rows().filter(r=>this.match(r)); },\n    init(){\n      const s=new URLSearchParams(location.search).get('state');\n      if(s==='home') this.sel=0;\n      if(s==='empty'){ this.q='zzz-no-signal'; this.sel=-1; }\n      this.$nextTick(()=>{ if(this.sel\u003c0){const v=this.visible();this.sel=v.length?Number(v[0].dataset.i):-1;} this.place(); });\n    },\n    place(){\n      this.rows().forEach(r=>{ r.style.display=this.match(r)?'':'none'; });\n      this.$nextTick(()=>{\n        const row=this.rows().find(r=>Number(r.dataset.i)===this.sel && this.match(r));\n        if(!row){ this.showPreview=false; return; }\n        this.curY=row.offsetTop; this.curH=row.offsetHeight;\n        this.applyPreview(Number(row.dataset.i));\n      });\n    },\n    applyPreview(i){\n      const map={\n        2:{t:'常用回复',m:'MEMO · 2 TAGS',k:'READOUT',b:'收到，我看一下再回复你。\\n会议纪要和补充材料我已上传到共享盘，链接在下方。',a:'粘贴'},\n        3:{t:'会议纪要草稿 上午十点在三楼会议室',m:'CLIP · eta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n\u003ctitle>04 棱镜 Prism\u003c/title>\n\u003cstyle>\n  :root{\n    --desk:#eef1f6;\n    --win:#ffffff;\n    --panel:#f5f6f8;\n    --ink:#0d0f14;\n    --muted:#6a7280;\n    --dim:#9aa1ab;\n    --line:#e4e7ec;\n    --line-strong:#d2d7de;\n    --accent:#2b62ff;\n    --accent-soft:rgba(43,98,255,.075);\n    --hl:#ffe45c;\n    --r-win:13px;\n    --r:8px;\n    --sans:\"OPPO Sans 4.0\",\"Noto Sans CJK SC\",system-ui,-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n    --mono:\"Noto Sans Mono CJK SC\",\"Noto Sans Mono\",ui-monospace,monospace;\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%}\n  body{font-family:var(--sans);background:var(--desk);color:var(--ink);-webkit-font-smoothing:antialiased}\n\n  /* 场景：明亮的桌面 */\n  .scene{position:relative;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:40px;overflow:hidden;\n    background:linear-gradient(180deg,#f2f5fa,#e7ebf3 60%,#e2e7f0)}\n  .scene::before{content:\"\";position:absolute;inset:0;pointer-events:none;\n    background:radial-gradient(50% 45% at 78% 18%,rgba(43,98,255,.10),transparent 70%),\n      radial-gradient(45% 40% at 15% 88%,rgba(43,98,255,.06),transparent 70%)}\n\n  /* 窗口 */\n  .window{position:relative;width:720px;max-width:100%;height:470px;display:flex;flex-direction:column;\n    background:var(--win);border:1px solid var(--line-strong);border-radius:var(--r-win);overflow:hidden;\n    box-shadow:0 26px 60px rgba(20,30,60,.20), 0 2px 6px rgba(20,30,60,.08);\n    animation:winIn .42s cubic-bezier(.22,1,.36,1) both}\n  @keyframes winIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}\n  .window[data-closed=\"true\"]{opacity:0;transform:scale(.985);transition:.16s;pointer-events:none}\n\n  /* 搜索行 */\n  .search{flex:none;display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;border-bottom:1px solid var(--line)}\n  .search .lens{width:17px;height:17px;color:var(--accent);flex:none}\n  .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);\n    font:500 15px/1 var(--sans);caret-color:var(--accent)}\n  .search input::placeholder{color:var(--dim)}\n  .scope{flex:none;font-size:11.5px;color:var(--muted);border:1px solid var(--line-strong);border-radius:999px;padding:3px 9px}\n  .gear{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--muted);border:1px solid transparent}\n  .gear:hover{color:var(--ink);border-color:var(--line-strong);background:var(--panel)}\n\n  /* 主体：结果 | 预览 */\n  .body{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:40% 1fr}\n  .list{position:relative;min-height:0;overflow-y:auto;padding:8px 6px 8px 8px;border-right:1px solid var(--line)}\n  .band{position:absolute;left:8px;right:6px;height:44px;border-radius:var(--r);z-index:0;pointer-events:none;\n    background:var(--accent-soft);transform:translateY(var(--b-y,0));transition:transform .26s cubic-bezier(.22,1,.36,1),height .2s}\n  .band::before{content:\"\";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}\n  .row{position:relative;z-index:1;display:flex;align-items:center;gap:10px;height:44px;padding:0 10px 0 12px;border-radius:var(--r);\n    cursor:default;user-select:none;animation:rowIn .36s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i) * 36ms + 70ms)}\n  @keyframes rowIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}\n  .row:hover{background:rgba(13,15,20,.035)}\n  .row[data-selected=\"true\"]{}\n  .row.pulse .r-main{animation:pop .3s ease}\n  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(.98)}100%{transform:scale(1)}}\n  .tile{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted);\n    background:var(--panel);border:1px solid var(--line)}\n  .tile svg{width:15px;height:15px}\n  .r-main{display:flex;flex-direction:column;gap:1px;min-width:0}\n  .title{font-size:13.5px;font-weight:500;color:#22262e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .row[data-selected=\"true\"] .title{color:var(--ink)}\n  .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}\n  .empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.9}\n  .empty b{display:block;color:var(--ink);font-size:13.5px;font-weight:600;margin-bottom:4px}\n\n  /* 右栏：常驻现场预览 */\n  .stage{min-height:0;overflow:auto;background:var(--panel);display:flex;flex-direction:column}\n  .stage-head{flex:none;display:flex;align-items:center;gap:9px;padding:13px 18px 11px;border-bottom:1px solid var(--line);background:var(--panel)}\n  .stage-kind{font:600 10px/1 var(--mono);letter-spacing:.12em;color:var(--accent);text-transform:uppercase;\n    background:var(--accent-soft);border-radius:5px;padding:4px 7px}\n  .stage-name{font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .stage-body{padding:16px 18px 18px}\n  .stage-body .lbl{font:600 10px/1 var(--mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin:0 0 7px}\n  .stage-body .val{margin:0 0 16px;font-size:13px;line-height:1.62;color:#2c313a;white-space:pre-wrap;word-break:break-word}\n  .stage-body .val.mono{font-family:var(--mono);font-size:12px;color:#3a414d}\n  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}\n  .tags span{font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 7px}\n  .bigtile{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;margin-bottom:14px;font-size:20px;font-weight:700}\n  .openline{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:2px}\n  .openline kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:#fff;color:var(--ink)}\n\n  /* 操作栏 */\n  .action{flex:none;display:flex;align-items:center;gap:16px;height:38px;padding:0 16px;border-top:1px solid var(--line);\n    font-size:11.5px;color:var(--muted);background:#fff}\n  .akey{display:inline-flex;align-items:center;gap:5px}\n  kbd{font-family:var(--mono);font-size:10px;color:#3a414d;background:var(--panel);border:1px solid var(--line-strong);\n    border-bottom-width:2px;border-radius:5px;padding:1px 5px;min-width:18px;text-align:center}\n  .count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim)}\n  .toast{position:absolute;left:50%;bottom:50px;transform:translateX(-50%) translateY(6px);z-index:6;\n    font-size:12px;color:#fff;background:var(--ink);border-radius:7px;padding:7px 14px;opacity:0;\n    transition:opacity .18s,transform .18s;pointer-events:none;box-shadow:0 12px 28px rgba(20,30,60,.28)}\n  .toast[data-on=\"true\"]{opacity:1;transform:translateX(-50%) translateY(0)}\n  .recall{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);font-size:12px;color:var(--muted)}\n  .recall[hidden]{display:none}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"scene\" x-data=\"launcher()\" x-init=\"init()\" @keydown.window=\"key($event)\" @click=\"closed=false\">\n  \u003cdiv class=\"window\" :data-closed=\"closed\" data-testid=\"window\">\n    \u003cdiv class=\"search\">\n      \u003csvg class=\"lens\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\">\u003ccircle cx=\"9\" cy=\"9\" r=\"5.6\"/>\u003cpath d=\"M13.2 13.2 17 17\"/>\u003c/svg>\n      \u003cinput x-model=\"q\" @input=\"onType()\" placeholder=\"搜索软件、备忘录、剪贴板…\" aria-label=\"搜索\" />\n      \u003cspan class=\"scope\">首屏\u003c/span>\n      \u003cspan class=\"gear\" title=\"设置\" aria-hidden=\"true\">\n        \u003csvg viewBox=\"0 0 20 20\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\">\u003ccircle cx=\"10\" cy=\"10\" r=\"2.6\"/>\u003cpath d=\"M10 2.6v2M10 15.4v2M17.4 10h-2M4.6 10h-2M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4M15.2 15.2l-1.4-1.4M6.2 6.2 4.8 4.8\"/>\u003c/svg>\n      \u003c/span>\n    \u003c/div>\n\n    \u003cdiv class=\"body\">\n      \u003c!-- 左：结果 -->\n      \u003cdiv class=\"list\" x-ref=\"list\">\n        \u003cdiv class=\"band\" :style=\"'--b-y:'+bY+'px;height:'+bH+'px'\">\u003c/div>\n\n        \u003cdiv class=\"row\" data-i=\"0\" data-search=\"重新扫描软件 命令 刷新已安装软件列表\" :data-selected=\"sel===0\" @click.stop=\"select(0)\" @mouseenter=\"select(0)\">\n          \u003cspan class=\"tile\">\u003csvg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 6l4 4-4 4M11 15h4\"/>\u003c/svg>\u003c/span>\n          \u003cspan class=\"r-main\">\u003cspan class=\"title\" data-orig=\"重新扫描软件\">重新扫描软件\u003c/span>\u003cspan class=\"sub\">命令 · 刷新软件列表\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"row\" data-i=\"1\" data-search=\"查看平台能力 命令 会话类型 权限状态\" :data-selected=\"sel===1\" @click.stop=\"select(1)\" @mouseenter=\"select(1)\">\n          \u003cspan class=\"tile\">\u003csvg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\">\u003ccircle cx=\"10\" cy=\"10\" r=\"7\"/>\u003cpath d=\"M10 6.4v4.2l2.6 1.6\"/>\u003c/svg>\u003c/span>\n          \u003cspan class=\"r-main\">\u003cspan class=\"title\" data-orig=\"查看平台能力\">查看平台能力\u003c/span>\u003cspan class=\"sub\">命令 · 能力状态\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"row\" data-i=\"2\" data-search=\"常用回复 备忘录 memo 回复 工作\" :data-selected=\"sel===2\" @click.stop=\"select(2)\" @mouseenter=\"select(2)\">\n          \u003cspan class=\"tile\" style=\"color:var(--accent)\">\u003csvg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 3.5h7l3 3v10H5z\"/>\u003cpath d=\"M7.5 9h5M7.5 12h3.5\"/>\u003c/svg>\u003c/span>\n          \u003cspan class=\"r-main\">\u003cspan class=\"title\" data-orig=\"常用回复\">常用回复\u003c/span>\u003cspan class=\"sub\">备忘录 · 回复、工作\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"row\" data-i=\"3\" data-search=\"会议纪要草稿 上午十点在三楼会议室 剪贴板 clipboard 文字 HTML Firefox\" :data-selected=\"sel===3\" @click.stop=\"select(3)\" @mouseenter=\"select(3)\">\n          \u003cspan class=\"tile\">\u003csvg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"5\" y=\"4.5\" width=\"10\" height=\"12\" rx=\"1.6\"/>\u003cpath d=\"M8 4.5V3.2h4v1.3M7.5 9h5M7.5 12h3\"/>\u003c/svg>\u003c/span>\n          \u003cspan class=\"r-main\">\u003cspan class=\"title\" data-orig=\"会议纪要草稿 上午十点在三楼会议室\">会议纪要草稿 上午十点在三楼会议室\u003c/span>\u003cspan class=\"sub\">剪贴板 · 文字、HTML\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"row\" data-i=\"4\" data-search=\"Rust 文档 书签 chrome bookmark doc.rust-lang.org\" :data-selected=\"sel===4\" @click.stop=\"select(4)\" @mouseenter=\"select(4)\">\n          \u003cspan class=\"tile\">\u003csvg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\u003crect x=\"3.5\" y=\"4.5\" width=\"13\" height=\"11\" rx=\"2\"/>\u003cpath d=\"M3.5 8h13\"/>\u003ccircle cx=\"6\" cy=\"6.2\" r=\".8\" fill=\"currentColor\" stroke=\"none\"/>\u003c/svg>\u003c/span>\n          \u003cspan class=\"r-main\">\u003cspan class=\"title\" data-orig=\"Rust 文档\">Rust 文档\u003c/span>\u003cspan class=\"sub\">书签 · doc.rust-lang.org\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"row\" data-i=\"5\" data-search=\"Firefox 浏览器 browser web 软件 浏览网页\" :data-selected=\"sel===5\" @click.stop=\"select(5)\" @mouseenter=\"select(5)\">\n          \u003cspan class=\"tile\" style=\"background:linear-gradient(150deg,#ff9d3d,#e2502a);border-color:transparent;color:#fff\">\u003csvg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003ccircle cx=\"10\" cy=\"10\" r=\"6.4\"/>\u003cpath d=\"M4 10h12M10 3.6c2 2 3 4 3 6.4s-1 4.4-3 6.4c-2-2-3-4-3-6.4s1-4.4 3-6.4z\"/>\u003c/svg>\u003c/span>\n          \u003cspan class=\"r-main\">\u003cspan class=\"title\" data-orig=\"Firefox 浏览器\">Firefox 浏览器\u003c/span>\u003cspan class=\"sub\">软件 · 浏览网页\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"row\" data-i=\"6\" data-search=\"Visual Studio Code 代码编辑器 软件 editor code\" :data-selected=\"sel===6\" @click.stop=\"select(6)\" @mouseenter=\"select(6)\">\n          \u003cspan class=\"tile\" style=\"background:#1f6feb;border-color:transparent;color:#fff\">\u003csvg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\">\u003cpath d=\"M4 6.5 10 10l-6 3.5V6.5zM10 10l6-3.5v7L10 10z\"/>\u003c/svg>\u003c/span>\n          \u003cspan class=\"r-main\">\u003cspan class=\"title\" data-orig=\"Visual Studio Code\">Visual Studio Code\u003c/span>\u003cspan class=\"sub\">软件 · 代码编辑器\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"row\" data-i=\"7\" data-search=\"终端 terminal shell 命令行 软件\" :data-selected=\"sel===7\" @click.stop=\"select(7)\" @mouseenter=\"select(7)\">\n          \u003cspan class=\"tile\" style=\"background:#111417;border-color:rgba(255,255,255,.1);color:#7ee0a3\">\u003csvg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4.5 6.5 8 10l-3.5 3.5M10.5 13.8h5\"/>\u003c/svg>\u003c/span>\n          \u003cspan class=\"r-main\">\u003cspan class=\"title\" data-orig=\"终端\">终端\u003c/span>\u003cspan class=\"sub\">软件 · 命令行\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"row\" data-i=\"8\" data-search=\"文件 files nautilus 浏览本地文件 软件\" :data-selected=\"sel===8\" @click.stop=\"select(8)\" @mouseenter=\"select(8)\">\n          \u003cspan class=\"tile\" style=\"background:#e8b23a;border-color:transparent;color:#3a2c08\">\u003csvg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\u003cpath d=\"M3 6.2c0-.7.6-1.2 1.2-1.2H8l1.4 1.6h5.4c.7 0 1.2.6 1.2 1.2v6.4c0 .7-.6 1.2-1.2 1.2H4.2c-.7 0-1.2-.6-1.2-1.2V6.2z\"/>\u003c/svg>\u003c/span>\n          \u003cspan class=\"r-main\">\u003cspan class=\"title\" data-orig=\"文件\">文件\u003c/span>\u003cspan class=\"sub\">软件 · 浏览本地文件\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 右：常驻预览 -->\n      \u003caside class=\"stage\" data-testid=\"preview\">\n        \u003cdiv class=\"stage-head\">\n          \u003cspan class=\"stage-kind\" x-text=\"pKind\">备忘录\u003c/span>\n          \u003cspan class=\"stage-name\" x-text=\"pName\">常用回复\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"stage-body\">\n          \u003cp class=\"lbl\" x-text=\"pMetaLabel\">标签\u003c/p>\n          \u003cdiv class=\"tags\" x-show=\"pTags.length\" x-html=\"pTags.map(t=>'\u003cspan>'+t+'\u003c/span>').join('')\">\u003cspan>回复\u003c/span>\u003cspan>工作\u003c/span>\u003c/div>\n          \u003cp class=\"lbl\" x-text=\"pBodyLabel\">正文\u003c/p>\n          \u003cp class=\"val\" x-text=\"pBody\">收到，我看一下再回复你。\n会议纪要和补充材料我已上传到共享盘，链接在下方。\u003c/p>\n          \u003cp class=\"openline\" x-show=\"pAction\">\u003ckbd>↵\u003c/kbd>\u003cspan x-text=\"pAction\">\u003c/span>\u003c/p>\n        \u003c/div>\n      \u003c/aside>\n    \u003c/div>\n\n    \u003cfooter class=\"action\">\n      \u003cspan class=\"akey\">\u003ckbd>↑\u003c/kbd>\u003ckbd>↓\u003c/kbd> 选择\u003c/span>\n      \u003cspan class=\"akey\">\u003ckbd>↵\u003c/kbd> \u003cspan data-testid=\"action-label\" x-text=\"actionLabel\">粘贴\u003c/span>\u003c/span>\n      \u003cspan class=\"akey\">\u this.rows().find(r=>Number(r.dataset.i)===this.sel && this.match(r));\n        if(!row) return;\n        this.bY=row.offsetTop; this.bH=row.offsetHeight;\n        this.applyStage(Number(row.dataset.i));\n      });\n    },\n    applyStage(i){\n      const map={\n        0:{k:'命令',n:'重新扫描软件',ml:'说明',tags:[],bl:'行为',b:'重新扫描已安装的软件列表，刷新首屏可搜索的软件集合。',a:'运行命令'},\n        1:{k:'命令',n:'查看平台能力',ml:'说明',tags:[],bl:'行为',b:'显示会话类型（X11 / Wayland）与快捷键、剪贴板、自动粘贴的真实支持状态。',a:'运行命令'},\n        2:{k:'备忘录',n:'常用回复',ml:'标签',tags:['回复','工作'],bl:'正文',b:'收到，我看一下再回复你。\\n会议纪要和补充材料我已上传到共享盘，链接在下方。',a:'粘贴到唤起前的应用'},\n        3:{k:'剪贴板',n:'会议纪要草稿 上午十点在三楼会议室',ml:'格式',tags:['文字','HTML'],bl:'内容',b:'会议纪要草稿\\n上午十点在三楼会议室\\n确认一下参加人',a:'粘贴到唤起前的应用'},\n        4:{k:'书签',n:'Rust 文档',ml:'目录',tags:['书签栏','开发'],bl:'链接',b:'https://doc.rust-lang.org/std/?q=中文&x=1',a:'在 Chrome 打开'},\n        5:{k:'软件',n:'Firefox 浏览器',ml:'来源',tags:['/usr/bin/firefox'],bl:'说明',b:'浏览网页。默认动作为打开。',a:'打开'},\n        6:{k:'软件',n:'Visual Studio Code',ml:'来源',tags:['/usr/bin/code'],bl:'说明',b:'代码编辑器。默认动作为打开。',a:'打开'},\n        7:{k:'软件',n:'终端',ml:'来源',tags:['/usr/bin/x-terminal-emulator'],bl:'说明',b:'命令行。默认动作为打开。',a:'打开'},\n        8:{k:'软件',n:'文件',ml:'来源',tags:['/usr/bin/nautilus'],bl:'说明',b:'浏览本地文件。默认动作为打开。',a:'打开'}\n      };\n      const d=map[i]; if(!d) return;\n      this.pKind=d.k; this.pName=d.n; this.pMetaLabel=d.ml; this.pTags=d.tags; this.pBodyLabel=d.bl; this.pBody=d.b; this.pAction=d.a;\n      this.actionLabel = (d.a==='在 Chrome 打开') ? '在 Chrome 打开' : (d.a==='粘贴到唤起前的应用' ? '粘贴' : '打开');\n    },\n    select(i){ if(this.sel===i) return; this.sel=i; this.place(); },\n    onType(){ const v=this.visible(); if(v.length && !v.some(r=>Number(r.dataset.i)===this.sel)) this.sel=Number(v[0].dataset.i); if(!v.length) this.sel=-1; this.place(); this.highlight(); },\n    move(d){ const v=this.visible(); if(!v.length) return; let p=v.findIndex(r=>Number(r.dataset.i)===this.sel); p=p\u003c0?0:Math.max(0,Math.min(v.length-1,p+d)); this.sel=Number(v[  function card(c,i){
  const a=el('article','card');a.dataset.id=c.id;a.style.setProperty('--i',i);a.setAttribute('aria-label',c.name);
  const frame=el('div','frame');frame.style.viewTransitionName=vtName(c);const s=stage(c,false);
  const hit=el('button','hit');hit.type='button';hit.setAttribute('aria-label',`单张查看 ${c.name}`);hit.addEventListener('click',()=>setLayout('loupe',c.id));
  s.append(hit);frame.append(s,el('span','pick-mark','已选择'),el('span','peek','点击单张查看 · 实际尺寸'));
  const cap=el('div','cap');cap.style.viewTransitionName=`cap-${C.indexOf(c)}`;cap.append(el('span',c.baseline?'no base':'no',no(c)),el('h2','name',c.name),stripMini(c),pickButton(c));
  const lede=el('p','lede',c.concept);lede.title=c.concept;lede.style.viewTransitionName=`lede-${C.indexOf(c)}`;
  a.append(frame,cap,lede);return a;
 }
 function syncCompare(){
  const list=shown(),g=$('#grid'),key=list.map(c=>c.id).join();
  if(key!==gridKey){gridKey=key;g.replaceChildren(...list.map(card));}
  g.dataset.notes=st.notesOn?'on':'off';g.style.setProperty('--cols',Math.min(Math.max(list.length,1),st.viewport==='mobile'?4:3));
  $$('.card .frame').forEach(f=>f.dataset.viewport=st.viewport);
 }

 // 单张查看：所有方向预先排成一条横向轨道，切换时整条轨道滑动，不重新加载画面
 function syncLoupe(dir){
  const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;
  if(key!==loupeKey){
   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?'适应窗口':'实际尺寸 100%');z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML='<kbd>←</kbd> <kbd>→</kbd> 切换方向　<kbd>P</kbd> 选择并复制<br><kbd>Esc</kbd> 回到并排';
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  if(st.notesOn)blocks.push(el('p','north',c.concept),sw,specList(c));
  blocks.push(pickButton(c),tools,hint,el('p','src',c.kind==='image'?`静态图：${c.sourceLabel}。缩放不代表响应式重排。`:c.kind==='url'?`实时运行 ${c.sourceLabel}。空白时确认开发服务器已启动，且允许被嵌入。`:c.interactive?`单张查看时可以直接操作 ${c.sourceLabel}；无法联网，也不保留浏览器存储。`:`预览禁用脚本与提交；交互请直接打开 ${c.sourceLabel}。`));
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?'适应窗口':'实际尺寸 100%';z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;$('#none').hidden=list.length>0;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  $('#notes-toggle').checked=st.notesOn;
  $('#filter-summary').textContent=`比较范围 ${list.length}/${C.length}`;
  $$('#filter-list input').forEach(i=>i.checked=st.visible.includes(i.value));
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”会带上最新备注重新复制，不再有单独的复制按钮
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
   animate($('#decide-name'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:380,easing:ease('glide')});
   animate($('#choice-chip'),[{transform:'scale(.3)'},{transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?'已选择':'已选择 · 复制'):(short?'选择':'选这个方向')));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?'再点一次，带上最新备注重新复制':'选择这个方向，并复制给 Agent';});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
  const c=byId[st.chosen];$('#decide-name').textContent=c?`${no(c)} ${c.name}`:'未选择方向';$('#picked').classList.toggle('on',!!c);
  const chip=$('#choice-chip'),next=c?stripMini(c):el('span','choice-empty');next.id='choice-chip';chip.replaceWith(next);
  status();
 }
 function status(){$('#notes-open').textContent=st.notes?'备注 ·':'备注';const s=$('#state');if(!stored){s.textContent='浏览器存储不可用：关闭页面后选择和备注不会保留。';s.dataset.warn='';}else{s.textContent='备注会和选择一起复制。改完备注，再点一次“已选择”重新复制。';delete s.dataset.warn;}}
 function copyText(){const c=byId[st.chosen];let t=`${DATA.round?DATA.round+'：':''}选 ${no(c)} ${c.name}`;if(st.notes.trim())t+=`\n备注：${st.notes.trim()}`;return t;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,t){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?'已复制，粘贴给 Agent':'复制失败，请手动复制';n.querySelector('code').textContent=ok?t.replace(/\n/g,' · '):t;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 const fl=$('#filter-list');
 C.forEach(c=>{const l=el('label'),i=el('input');i.type='checkbox';i.value=c.id;i.addEventListener('change',()=>{st.visible=C.map(x=>x.id).filter(id=>id===c.id?i.checked:st.visible.includes(id));save();morph(render,'reshape');});l.append(i,el('span','n',no(c)),c.name);fl.append(l);});
 $('#show-all').addEventListener('click',()=>{st.visible=C.map(c=>c.id);save();morph(render,'reshape');});
 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 $('#notes-toggle').addEventListener('change',e=>{st.notesOn=e.target.checked;save();morph(render,'reshape');});
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 const notes=$('#notes');notes.value=st.notes||'';
 notes.addEventListener('input',()=>{st.notes=notes.value;save();status();});
 $('#notes-open').parentElement.addEventListener('toggle',e=>{if(e.target.open)notes.focus();});
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
