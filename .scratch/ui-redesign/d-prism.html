<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>04 棱镜 Prism</title>
<style>
  :root{
    --desk:#eef1f6;
    --win:#ffffff;
    --panel:#f5f6f8;
    --ink:#0d0f14;
    --muted:#6a7280;
    --dim:#9aa1ab;
    --line:#e4e7ec;
    --line-strong:#d2d7de;
    --accent:#2b62ff;
    --accent-soft:rgba(43,98,255,.075);
    --hl:#ffe45c;
    --r-win:13px;
    --r:8px;
    --sans:"OPPO Sans 4.0","Noto Sans CJK SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"Noto Sans Mono CJK SC","Noto Sans Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);background:var(--desk);color:var(--ink);-webkit-font-smoothing:antialiased}

  /* 场景：明亮的桌面 */
  .scene{position:relative;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:40px;overflow:hidden;
    background:linear-gradient(180deg,#f2f5fa,#e7ebf3 60%,#e2e7f0)}
  .scene::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(50% 45% at 78% 18%,rgba(43,98,255,.10),transparent 70%),
      radial-gradient(45% 40% at 15% 88%,rgba(43,98,255,.06),transparent 70%)}

  /* 窗口 */
  .window{position:relative;width:720px;max-width:100%;height:470px;display:flex;flex-direction:column;
    background:var(--win);border:1px solid var(--line-strong);border-radius:var(--r-win);overflow:hidden;
    box-shadow:0 26px 60px rgba(20,30,60,.20), 0 2px 6px rgba(20,30,60,.08);
    animation:winIn .42s cubic-bezier(.22,1,.36,1) both}
  @keyframes winIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
  .window[data-closed="true"]{opacity:0;transform:scale(.985);transition:.16s;pointer-events:none}

  /* 搜索行 */
  .search{flex:none;display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;border-bottom:1px solid var(--line)}
  .search .lens{width:17px;height:17px;color:var(--accent);flex:none}
  .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);
    font:500 15px/1 var(--sans);caret-color:var(--accent)}
  .search input::placeholder{color:var(--dim)}
  .scope{flex:none;font-size:11.5px;color:var(--muted);border:1px solid var(--line-strong);border-radius:999px;padding:3px 9px}
  .gear{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--muted);border:1px solid transparent}
  .gear:hover{color:var(--ink);border-color:var(--line-strong);background:var(--panel)}

  /* 主体：结果 | 预览 */
  .body{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:40% 1fr}
  .list{position:relative;min-height:0;overflow-y:auto;padding:8px 6px 8px 8px;border-right:1px solid var(--line)}
  .band{position:absolute;left:8px;right:6px;height:44px;border-radius:var(--r);z-index:0;pointer-events:none;
    background:var(--accent-soft);transform:translateY(var(--b-y,0));transition:transform .26s cubic-bezier(.22,1,.36,1),height .2s}
  .band::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
  .row{position:relative;z-index:1;display:flex;align-items:center;gap:10px;height:44px;padding:0 10px 0 12px;border-radius:var(--r);
    cursor:default;user-select:none;animation:rowIn .36s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i) * 36ms + 70ms)}
  @keyframes rowIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
  .row:hover{background:rgba(13,15,20,.035)}
  .row[data-selected="true"]{}
  .row.pulse .r-main{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(.98)}100%{transform:scale(1)}}
  .tile{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted);
    background:var(--panel);border:1px solid var(--line)}
  .tile svg{width:15px;height:15px}
  .r-main{display:flex;flex-direction:column;gap:1px;min-width:0}
  .title{font-size:13.5px;font-weight:500;color:#22262e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row[data-selected="true"] .title{color:var(--ink)}
  .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
  .empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.9}
  .empty b{display:block;color:var(--ink);font-size:13.5px;font-weight:600;margin-bottom:4px}

  /* 右栏：常驻现场预览 */
  .stage{min-height:0;overflow:auto;background:var(--panel);display:flex;flex-direction:column}
  .stage-head{flex:none;display:flex;align-items:center;gap:9px;padding:13px 18px 11px;border-bottom:1px solid var(--line);background:var(--panel)}
  .stage-kind{font:600 10px/1 var(--mono);letter-spacing:.12em;color:var(--accent);text-transform:uppercase;
    background:var(--accent-soft);border-radius:5px;padding:4px 7px}
  .stage-name{font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stage-body{padding:16px 18px 18px}
  .stage-body .lbl{font:600 10px/1 var(--mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin:0 0 7px}
  .stage-body .val{margin:0 0 16px;font-size:13px;line-height:1.62;color:#2c313a;white-space:pre-wrap;word-break:break-word}
  .stage-body .val.mono{font-family:var(--mono);font-size:12px;color:#3a414d}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
  .tags span{font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 7px}
  .bigtile{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;margin-bottom:14px;font-size:20px;font-weight:700}
  .openline{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:2px}
  .openline kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:#fff;color:var(--ink)}

  /* 操作栏 */
  .action{flex:none;display:flex;align-items:center;gap:16px;height:38px;padding:0 16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--muted);background:#fff}
  .akey{display:inline-flex;align-items:center;gap:5px}
  kbd{font-family:var(--mono);font-size:10px;color:#3a414d;background:var(--panel);border:1px solid var(--line-strong);
    border-bottom-width:2px;border-radius:5px;padding:1px 5px;min-width:18px;text-align:center}
  .count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim)}
  .toast{position:absolute;left:50%;bottom:50px;transform:translateX(-50%) translateY(6px);z-index:6;
    font-size:12px;color:#fff;background:var(--ink);border-radius:7px;padding:7px 14px;opacity:0;
    transition:opacity .18s,transform .18s;pointer-events:none;box-shadow:0 12px 28px rgba(20,30,60,.28)}
  .toast[data-on="true"]{opacity:1;transform:translateX(-50%) translateY(0)}
  .recall{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);font-size:12px;color:var(--muted)}
  .recall[hidden]{display:none}
</style>
</head>
<body>
<div class="scene" x-data="launcher()" x-init="init()" @keydown.window="key($event)" @click="closed=false">
  <div class="window" :data-closed="closed" data-testid="window">
    <div class="search">
      <svg class="lens" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="9" r="5.6"/><path d="M13.2 13.2 17 17"/></svg>
      <input x-model="q" @input="onType()" placeholder="搜索软件、备忘录、剪贴板…" aria-label="搜索" />
      <span class="scope">首屏</span>
      <span class="gear" title="设置" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.6v2M10 15.4v2M17.4 10h-2M4.6 10h-2M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4M15.2 15.2l-1.4-1.4M6.2 6.2 4.8 4.8"/></svg>
      </span>
    </div>

    <div class="body">
      <!-- 左：结果 -->
      <div class="list" x-ref="list">
        <div class="band" :style="'--b-y:'+bY+'px;height:'+bH+'px'"></div>

        <div class="row" data-i="0" data-search="重新扫描软件 命令 刷新已安装软件列表" :data-selected="sel===0" @click.stop="select(0)" @mouseenter="select(0)">
          <span class="tile"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6l4 4-4 4M11 15h4"/></svg></span>
          <span class="r-main"><span class="title" data-orig="重新扫描软件">重新扫描软件</span><span class="sub">命令 · 刷新软件列表</span></span>
        </div>
        <div class="row" data-i="1" data-search="查看平台能力 命令 会话类型 权限状态" :data-selected="sel===1" @click.stop="select(1)" @mouseenter="select(1)">
          <span class="tile"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 6.4v4.2l2.6 1.6"/></svg></span>
          <span class="r-main"><span class="title" data-orig="查看平台能力">查看平台能力</span><span class="sub">命令 · 能力状态</span></span>
        </div>
        <div class="row" data-i="2" data-search="常用回复 备忘录 memo 回复 工作" :data-selected="sel===2" @click.stop="select(2)" @mouseenter="select(2)">
          <span class="tile" style="color:var(--accent)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5h7l3 3v10H5z"/><path d="M7.5 9h5M7.5 12h3.5"/></svg></span>
          <span class="r-main"><span class="title" data-orig="常用回复">常用回复</span><span class="sub">备忘录 · 回复、工作</span></span>
        </div>
        <div class="row" data-i="3" data-search="会议纪要草稿 上午十点在三楼会议室 剪贴板 clipboard 文字 HTML Firefox" :data-selected="sel===3" @click.stop="select(3)" @mouseenter="select(3)">
          <span class="tile"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="10" height="12" rx="1.6"/><path d="M8 4.5V3.2h4v1.3M7.5 9h5M7.5 12h3"/></svg></span>
          <span class="r-main"><span class="title" data-orig="会议纪要草稿 上午十点在三楼会议室">会议纪要草稿 上午十点在三楼会议室</span><span class="sub">剪贴板 · 文字、HTML</span></span>
        </div>
        <div class="row" data-i="4" data-search="Rust 文档 书签 chrome bookmark doc.rust-lang.org" :data-selected="sel===4" @click.stop="select(4)" @mouseenter="select(4)">
          <span class="tile"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="4.5" width="13" height="11" rx="2"/><path d="M3.5 8h13"/><circle cx="6" cy="6.2" r=".8" fill="currentColor" stroke="none"/></svg></span>
          <span class="r-main"><span class="title" data-orig="Rust 文档">Rust 文档</span><span class="sub">书签 · doc.rust-lang.org</span></span>
        </div>
        <div class="row" data-i="5" data-search="Firefox 浏览器 browser web 软件 浏览网页" :data-selected="sel===5" @click.stop="select(5)" @mouseenter="select(5)">
          <span class="tile" style="background:linear-gradient(150deg,#ff9d3d,#e2502a);border-color:transparent;color:#fff"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="6.4"/><path d="M4 10h12M10 3.6c2 2 3 4 3 6.4s-1 4.4-3 6.4c-2-2-3-4-3-6.4s1-4.4 3-6.4z"/></svg></span>
          <span class="r-main"><span class="title" data-orig="Firefox 浏览器">Firefox 浏览器</span><span class="sub">软件 · 浏览网页</span></span>
        </div>
        <div class="row" data-i="6" data-search="Visual Studio Code 代码编辑器 软件 editor code" :data-selected="sel===6" @click.stop="select(6)" @mouseenter="select(6)">
          <span class="tile" style="background:#1f6feb;border-color:transparent;color:#fff"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 6.5 10 10l-6 3.5V6.5zM10 10l6-3.5v7L10 10z"/></svg></span>
          <span class="r-main"><span class="title" data-orig="Visual Studio Code">Visual Studio Code</span><span class="sub">软件 · 代码编辑器</span></span>
        </div>
        <div class="row" data-i="7" data-search="终端 terminal shell 命令行 软件" :data-selected="sel===7" @click.stop="select(7)" @mouseenter="select(7)">
          <span class="tile" style="background:#111417;border-color:rgba(255,255,255,.1);color:#7ee0a3"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5 8 10l-3.5 3.5M10.5 13.8h5"/></svg></span>
          <span class="r-main"><span class="title" data-orig="终端">终端</span><span class="sub">软件 · 命令行</span></span>
        </div>
        <div class="row" data-i="8" data-search="文件 files nautilus 浏览本地文件 软件" :data-selected="sel===8" @click.stop="select(8)" @mouseenter="select(8)">
          <span class="tile" style="background:#e8b23a;border-color:transparent;color:#3a2c08"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 6.2c0-.7.6-1.2 1.2-1.2H8l1.4 1.6h5.4c.7 0 1.2.6 1.2 1.2v6.4c0 .7-.6 1.2-1.2 1.2H4.2c-.7 0-1.2-.6-1.2-1.2V6.2z"/></svg></span>
          <span class="r-main"><span class="title" data-orig="文件">文件</span><span class="sub">软件 · 浏览本地文件</span></span>
        </div>
      </div>

      <!-- 右：常驻预览 -->
      <aside class="stage" data-testid="preview">
        <div class="stage-head">
          <span class="stage-kind" x-text="pKind">备忘录</span>
          <span class="stage-name" x-text="pName">常用回复</span>
        </div>
        <div class="stage-body">
          <p class="lbl" x-text="pMetaLabel">标签</p>
          <div class="tags" x-show="pTags.length" x-html="pTags.map(t=>'<span>'+t+'</span>').join('')"><span>回复</span><span>工作</span></div>
          <p class="lbl" x-text="pBodyLabel">正文</p>
          <p class="val" x-text="pBody">收到，我看一下再回复你。
会议纪要和补充材料我已上传到共享盘，链接在下方。</p>
          <p class="openline" x-show="pAction"><kbd>↵</kbd><span x-text="pAction"></span></p>
        </div>
      </aside>
    </div>

    <footer class="action">
      <span class="akey"><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span class="akey"><kbd>↵</kbd> <span data-testid="action-label" x-text="actionLabel">粘贴</span></span>
      <span class="akey"><kbd>esc</kbd> 关闭</span>
      <span class="count" x-text="countLabel">9 条结果</span>
    </footer>
    <div class="toast" :data-on="toast!==''" x-text="toast"></div>
  </div>
  <p class="recall" :hidden="!closed">窗口已关闭 · 点击任意处唤起</p>
</div>

<script src="vendor/alpine.min.js" defer></script>
<script>
function launcher(){
  return {
    sel:2, bY:0, bH:44, q:'', toast:'', closed:false,
    pKind:'备忘录', pName:'常用回复', pMetaLabel:'标签', pTags:['回复','工作'], pBodyLabel:'正文',
    pBody:'收到，我看一下再回复你。\n会议纪要和补充材料我已上传到共享盘，链接在下方。', pAction:'粘贴到唤起前的应用',
    actionLabel:'粘贴',
    get countLabel(){ return this.rows().filter(r=>this.match(r)).length + ' 条结果'; },
    rows(){ return this.$refs.list ? Array.from(this.$refs.list.querySelectorAll('.row')) : []; },
    match(row){ return !this.q || row.dataset.search.toLowerCase().includes(this.q.toLowerCase()); },
    visible(){ return this.rows().filter(r=>this.match(r)); },
    init(){
      const s=new URLSearchParams(location.search).get('state');
      if(s==='home') this.sel=0;
      if(s==='empty'){ this.q='zzz'; this.sel=-1; }
      this.$nextTick(()=>{ if(this.sel<0){const v=this.visible();this.sel=v.length?Number(v[0].dataset.i):-1;} this.place(); this.highlight(); });
    },
    highlight(){
      const q=this.q.trim();
      this.rows().forEach(r=>{
        const t=r.querySelector('.title'); const orig=t.dataset.orig || t.textContent; t.dataset.orig=orig;
        if(!q){ t.textContent=orig; return; }
        const i=orig.toLowerCase().indexOf(q.toLowerCase());
        if(i<0){ t.textContent=orig; return; }
        t.innerHTML = orig.slice(0,i).replace(/</g,'&lt;') + '<mark>' + orig.slice(i,i+q.length).replace(/</g,'&lt;') + '</mark>' + orig.slice(i+q.length).replace(/</g,'&lt;');
      });
    },
    place(){
      this.rows().forEach(r=>{ r.style.display=this.match(r)?'':'none'; });
      this.$nextTick(()=>{
        const row=this.rows().find(r=>Number(r.dataset.i)===this.sel && this.match(r));
        if(!row) return;
        this.bY=row.offsetTop; this.bH=row.offsetHeight;
        this.applyStage(Number(row.dataset.i));
      });
    },
    applyStage(i){
      const map={
        0:{k:'命令',n:'重新扫描软件',ml:'说明',tags:[],bl:'行为',b:'重新扫描已安装的软件列表，刷新首屏可搜索的软件集合。',a:'运行命令'},
        1:{k:'命令',n:'查看平台能力',ml:'说明',tags:[],bl:'行为',b:'显示会话类型（X11 / Wayland）与快捷键、剪贴板、自动粘贴的真实支持状态。',a:'运行命令'},
        2:{k:'备忘录',n:'常用回复',ml:'标签',tags:['回复','工作'],bl:'正文',b:'收到，我看一下再回复你。\n会议纪要和补充材料我已上传到共享盘，链接在下方。',a:'粘贴到唤起前的应用'},
        3:{k:'剪贴板',n:'会议纪要草稿 上午十点在三楼会议室',ml:'格式',tags:['文字','HTML'],bl:'内容',b:'会议纪要草稿\n上午十点在三楼会议室\n确认一下参加人',a:'粘贴到唤起前的应用'},
        4:{k:'书签',n:'Rust 文档',ml:'目录',tags:['书签栏','开发'],bl:'链接',b:'https://doc.rust-lang.org/std/?q=中文&x=1',a:'在 Chrome 打开'},
        5:{k:'软件',n:'Firefox 浏览器',ml:'来源',tags:['/usr/bin/firefox'],bl:'说明',b:'浏览网页。默认动作为打开。',a:'打开'},
        6:{k:'软件',n:'Visual Studio Code',ml:'来源',tags:['/usr/bin/code'],bl:'说明',b:'代码编辑器。默认动作为打开。',a:'打开'},
        7:{k:'软件',n:'终端',ml:'来源',tags:['/usr/bin/x-terminal-emulator'],bl:'说明',b:'命令行。默认动作为打开。',a:'打开'},
        8:{k:'软件',n:'文件',ml:'来源',tags:['/usr/bin/nautilus'],bl:'说明',b:'浏览本地文件。默认动作为打开。',a:'打开'}
      };
      const d=map[i]; if(!d) return;
      this.pKind=d.k; this.pName=d.n; this.pMetaLabel=d.ml; this.pTags=d.tags; this.pBodyLabel=d.bl; this.pBody=d.b; this.pAction=d.a;
      this.actionLabel = (d.a==='在 Chrome 打开') ? '在 Chrome 打开' : (d.a==='粘贴到唤起前的应用' ? '粘贴' : '打开');
    },
    select(i){ if(this.sel===i) return; this.sel=i; this.place(); },
    onType(){ const v=this.visible(); if(v.length && !v.some(r=>Number(r.dataset.i)===this.sel)) this.sel=Number(v[0].dataset.i); if(!v.length) this.sel=-1; this.place(); this.highlight(); },
    move(d){ const v=this.visible(); if(!v.length) return; let p=v.findIndex(r=>Number(r.dataset.i)===this.sel); p=p<0?0:Math.max(0,Math.min(v.length-1,p+d)); this.sel=Number(v[p].dataset.i); this.place(); },
    key(e){
      if(this.closed) return;
      if(e.key==='ArrowDown'){e.preventDefault();this.move(1);}
      else if(e.key==='ArrowUp'){e.preventDefault();this.move(-1);}
      else if(e.key==='Enter'){e.preventDefault();this.fire();}
      else if(e.key==='Escape'){e.preventDefault();this.closed=true;}
    },
    fire(){
      const row=this.rows().find(r=>Number(r.dataset.i)===this.sel); if(!row) return;
      const name=row.querySelector('.title').textContent;
      row.classList.remove('pulse'); void row.offsetWidth; row.classList.add('pulse');
      const al=this.actionLabel;
      this.toast = al.includes('Chrome') ? ('↗ 在 Chrome 打开：'+name) : (al==='粘贴' ? ('✓ 已粘贴：'+name) : ('✓ 已打开：'+name));
      clearTimeout(this._t); this._t=setTimeout(()=>this.toast='',1600);
    }
  }
}
</script>
