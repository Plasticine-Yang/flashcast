appId: com.flashcast.app
productName: Flashcast
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: build
    to: build
    filter:
      - icon.png
      - icon.svg
      - tray.png
      - trayTemplate.png
      - trayTemplate@2x.png
      - video-cover.png
asarUnpack:
  - resources/**
# 仓库没有 Apple 证书，产物默认不带有效签名；arm64 上未签名的 bundle 会被 amfid 拒绝、
# 启动即退出，所以打包后统一补 ad-hoc 签名（已有有效签名则跳过）。
afterPack: scripts/after-pack.mjs
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - dmg
    - zip
  extendInfo:
    LSUIElement: true
    NSAppleEventsUsageDescription: Flashcast uses AppleScript to paste on your behalf.
win:
  icon: build/icon.png
  target:
    - nsis
linux:
  # 必须给一整套标准尺寸（build/icons/NxN.png）：hicolor 的 index.theme 只索引到
  # 512x512，单个 1024x1024 的 PNG 会被桌面当成“没有图标”。
  icon: build/icons
  category: Utility
  # deb 包要求 maintainer；package.json 的 author 没有邮箱时 electron-builder 会拒绝打包。
  maintainer: Plasticine-Yang <Plasticine-Yang@users.noreply.github.com>
  target:
    - AppImage
    - deb
  # 安装的 .desktop 文件名必须与 package.json#desktopName 一致（com.flashcast.app.desktop）：
  # Electron 用它作为 XDG app_id / WM_CLASS，xdg-desktop-portal 也要求 Wayland 全局快捷键的
  # 应用身份能解析到同名 .desktop 文件。
  syncDesktopName: true
  desktop:
    entry:
      Name: Flashcast
      Comment: Fast, keyboard-first launcher
      Keywords: launcher;search;clipboard;
      StartupNotify: 'false'
