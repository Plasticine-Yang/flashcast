[package]
name = "flashcast-core"
description = "Flashcast 无头宿主：查询入口、命令入口、排序、插件注册表与设置"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flashcast-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# 配置工作区的 Git 操作（ADR §9）。ticket 05 只用到 init / open；远端克隆、提交与
# 同步由 ticket 14/15/16 补齐，那时按研究记录改为：
#   git2 = { version = "0.21.0", default-features = false,
#            features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
git2 = { version = "0.21.0", default-features = false }
# 工作区文件监听（ADR §8；设计见 notes/research/git-workspace.md §6）。
notify-debouncer-full = "0.7.0"

[dev-dependencies]
# 测试替身由 flashcast-platform 的 `fake` feature 提供（ADR §5）。
flashcast-platform = { workspace = true, features = ["fake"] }
tempfile = "3.27.0"
