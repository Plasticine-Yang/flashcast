[package]
name = "flashcast-core"
description = "Flashcast 无头宿主：查询入口、命令入口、排序、插件注册表与设置"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flashcast-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# 配置工作区的 Git 操作（ADR §9）。ticket 05 只用到 init / open；ticket 14 起需要真实
# 远端，因此打开 `https` 与 `ssh`（git2 0.21 默认两者都不开）：`https` 同时引入
# `openssl-sys` —— git2 的 TLS 唯一后端，没有 schannel / security-framework 可选。
#
# 必须同时启用 `vendored-openssl`：CI 上 macOS 的 x86_64 是**在 arm64 runner 上交叉编译**的，
# 那里只有 arm64 的 Homebrew OpenSSL，`openssl-sys` 找不到目标架构的库而直接编译失败
# （CI 运行 36782404097 的实测）。随包编译 OpenSSL 才能让四条腿都成立；代价是各腿多花
# 几分钟编译 C。Linux 需要 perl/make，Windows 需要 Perl 与 NASM（CI 中显式断言）。
# 不启用 `vendored-libgit2`：各腿的系统 libgit2 可用，且 libgit2 本身不引入 TLS 依赖。
git2 = { version = "0.21.0", default-features = false, features = [
    "https",
    "ssh",
    "vendored-openssl",
] }
# 工作区文件监听（ADR §8；设计见 notes/research/git-workspace.md §6）。
notify-debouncer-full = "0.7.0"
# 本机数据（剪贴板历史与索引、附件）的存储（ADR §8）。必须用 `bundled`：
# 各平台系统 SQLite 的版本差异会让同一份 schema 在不同机器上行为不同。
# 关闭默认 feature 后 `bundled` 自己会把 `libsqlite3-sys` 配成随包编译。
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[dev-dependencies]
# 测试替身由 flashcast-platform 的 `fake` feature 提供（ADR §5）。
flashcast-platform = { workspace = true, features = ["fake"] }
tempfile = "3.27.0"
