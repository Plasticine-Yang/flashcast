[package]
name = "flashcast-core"
description = "Flashcast 无头宿主：查询入口、命令入口、排序、插件注册表与设置"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flashcast-platform = { workspace = true }
serde = { workspace = true }
