[package]
name = "flashcast-platform"
description = "Flashcast 平台适配层：软件发现、启动、焦点、快捷键与能力探测"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# 仅在需要确定性测试替身时启用；替身只存在于本 crate 的 `fake` 模块。
fake = []

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
# 纯 Rust 的 .lnk 解析器：与操作系统无关，因此 Windows 的开始菜单解析逻辑
# 可以在 Linux 上被真实夹具测试（见 tests/windows_fixture.rs）。
# 必须保留默认 feature `serde`：0.6.4 的源码无条件使用 `#[serde(skip)]`，
# 关闭默认 feature 会直接编译失败。
lnk = "0.6.4"
# Windows 图标抽取（`IShellItemImageFactory::GetImage`）得到的像素要编码成 PNG。
# 放在通用依赖而不是 Windows 专属依赖：像素编码是纯逻辑，`windows_fixture.rs`
# 在 Linux 上以真实像素做往返验证，因此必须在开发机上可编译。
image = { version = "0.25.10", default-features = false, features = ["png"] }

# macOS `.app` 包的 Info.plist 解析。该 crate 是纯 Rust、跨平台的，因此不按目标
# 条件编译：`src/macos/bundle.rs` 的遍历与字段映射逻辑要在 Linux 上也能被夹具测试。
plist = "1.10.1"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
global-hotkey = "0.8.0"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
futures-util = "0.3"
# 与 global-hotkey 依赖的 x11rb 保持同一版本，避免重复编译两份。
x11rb = "0.13.2"
# 合成 Ctrl+V（研究笔记 §4.1：enigo 是唯一同时覆盖 Windows / macOS / X11 的成熟
# 合成输入库，API 已逐项核对）。Linux 后端走 XTEST，只在 `x11rb` feature 下编译；
# **不启用 `wayland` feature**：它依赖 wlroots 专有协议，GNOME 未实现，启用只会
# 造成「看起来支持、实际无效」的假象（研究 §3.4.3）。
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }

[target.'cfg(target_os = "windows")'.dependencies]
# 与 Tauri 2.12 依赖的 `windows` 版本一致，feature 统一后共用同一份编译。
# 每个 feature 是 Win32 命名空间叶子；下面的注释写明本 crate 实际用到的 API。
windows = { version = "0.62.2", features = [
    "Win32_Foundation", # HWND、HINSTANCE、BOOL、SIZE
    "Win32_UI_Shell", # IShellLinkW、ShellExecuteW、SHCreateItemFromParsingName、IShellItemImageFactory
    "Win32_UI_Shell_Common", # ITEMIDLIST（IShellLinkW 的 GetIDList 需要）
    "Win32_UI_WindowsAndMessaging", # GetForegroundWindow、SetForegroundWindow、ShowWindow、GetWindowTextW
    "Win32_UI_Input_KeyboardAndMouse", # GetActiveWindow、SetActiveWindow、SetFocus
    "Win32_System_Com", # CoInitializeEx、CoCreateInstance、IPersistFile
    "Win32_System_DataExchange", # OpenClipboard、EmptyClipboard、SetClipboardData（剪贴板文本）
    "Win32_System_Memory", # GlobalAlloc、GlobalLock、GlobalUnlock（CF_UNICODETEXT 内存块）
    "Win32_System_Ole", # CF_UNICODETEXT
    "Win32_System_Threading", # OpenProcess、QueryFullProcessImageNameW、AttachThreadInput
    "Win32_Storage_FileSystem", # WIN32_FIND_DATAW（IShellLinkW::GetPath 的 pfd 参数）
    "Win32_Graphics_Gdi", # HBITMAP、GetDIBits、GetDC（GetImage 在缺少该 feature 时是空槽）
] }
# 只读注册表，不需要 9 MB 的 `windows` bindings；用 wow64_32/wow64_64 视图，
# 而不是拼接 WOW6432Node 字符串。
windows-registry = "0.100.0"
# 合成 Ctrl+V。Windows 后端用 user32 的 SendInput，并用 `dwExtraInfo` 打标，
# 让宿主自己的全局快捷键不会把这次合成按键当成用户输入（研究 §4.1/§4.3）。
enigo = { version = "0.6.1", default-features = false }

# macOS 适配层。全部经 `cfg(target_os = "macos")` 条件编译，Linux 构建不受影响；
# 这些 crate 只做 FFI，`cargo check --target x86_64-apple-darwin` 不需要 macOS SDK。
[target.'cfg(target_os = "macos")'.dependencies]
# global-hotkey 的 macOS 后端用 Carbon RegisterEventHotKey + 应用事件目标。
global-hotkey = "0.8.0"
objc2 = "0.6.4"
# 每个 feature 都要显式声明：objc2-app-kit 以 default-features = false 引入
# objc2-foundation，不声明就会缺少 NSString / NSData 等基本类型。
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSString",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSProcessInfo",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    # processIdentifier / runningApplicationWithProcessIdentifier 由 libc feature 提供。
    "libc",
    "NSWorkspace",
    "NSImage",
    # NSBitmapImageRep 本身由 NSImageRep 提供（其父类）。
    "NSImageRep",
    "NSBitmapImageRep",
    "NSRunningApplication",
] }
# AXIsProcessTrusted / AXIsProcessTrustedWithOptions 与 kAXTrustedCheckOptionPrompt。
objc2-application-services = { version = "0.3.2", default-features = false, features = [
    "std",
    "HIServices",
    "AXUIElement",
    "objc2",
] }
# 辅助功能权限提示字典。CFBoolean 定义在 CFNumber 模块下，feature 名是 CFNumber。
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFString",
    "CFNumber",
    "CFDictionary",
    "objc2",
] }
# 合成 Cmd+V。macOS 后端用 CGEvent，并用 `event_source_user_data` 打标；
# 是否可用取决于「辅助功能」权限，权限判断在 `macos::focus` 里自己做，
# 因此这里关掉 enigo 的自动权限弹窗（`open_prompt_to_get_permissions = false`）。
enigo = { version = "0.6.1", default-features = false }

[[bin]]
name = "flashcast-platform-check"
path = "src/bin/platform_check.rs"
