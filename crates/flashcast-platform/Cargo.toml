[package]
name = "flashcast-platform"
description = "Flashcast 平台适配层：软件发现、启动、焦点、快捷键与能力探测"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# 仅在需要确定性测试替身时启用；替身只存在于本 crate 的 `fake` 模块。
fake = []

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
# macOS `.app` 包的 Info.plist 解析。该 crate 是纯 Rust、跨平台的，因此不按目标
# 条件编译：`src/macos/bundle.rs` 的遍历与字段映射逻辑要在 Linux 上也能被夹具测试。
plist = "1.10.1"

[target.'cfg(target_os = "linux")'.dependencies]
global-hotkey = "0.8.0"
# 与 global-hotkey 依赖的 x11rb 保持同一版本，避免重复编译两份。
x11rb = "0.13.2"

[[bin]]
name = "flashcast-platform-check"
path = "src/bin/platform_check.rs"
