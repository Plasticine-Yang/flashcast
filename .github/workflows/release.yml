name: Release

# 推送 v* tag 触发：校验版本号 → 三端打包 → 创建 GitHub Release。
# 本地用 `pnpm release:minor` / `release:patch` / `release:major` 升版本并推送 tag。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: 校验版本号
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tag 必须与 package.json 版本一致
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 ${version} 不一致，请用 pnpm release:* 发布"
            exit 1
          fi
          echo "发布版本 ${version}"

  build:
    name: 打包 ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # 打包 + 最多两轮 60s 退避重试，正常路径在 5 分钟内完成。
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            args: --linux --x64
          - name: macos
            os: macos-latest
            args: --mac --x64 --arm64
          - name: windows-x64
            os: windows-latest
            args: --win --x64
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        shell: bash
        run: |
          set -euo pipefail
          # GitHub 的 release 资产 CDN 偶发 504（v0.4.4 发布时 Linux job 连续命中）：
          # 依赖安装与打包都按 60s 退避重试两次，让瞬时故障在一条流水线内自愈。
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "::warning title=依赖安装失败::第 ${attempt}/3 次失败，60 秒后重试"
            sleep 60
          done
          echo "::error title=依赖安装失败::连续 3 次失败"
          exit 1
      - run: pnpm build
      - name: 打包（不直接发布）
        shell: bash
        env:
          # 仓库没有 macOS / Windows 开发者证书，显式跳过签名发现，避免打包失败。
          # macOS 产物随后由 afterPack 钩子补 ad-hoc 签名（否则 arm64 上启动即退出）。
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm exec electron-builder ${{ matrix.args }} --publish never; then
              exit 0
            fi
            echo "::warning title=打包失败::第 ${attempt}/3 次失败，60 秒后重试"
            sleep 60
          done
          echo "::error title=打包失败::连续 3 次失败"
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: 生成 SHA256 校验和
        run: |
          set -euo pipefail
          cd assets
          ls -lh
          sha256sum * > SHA256SUMS.txt
      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 该 job 不 checkout 仓库，显式告诉 gh 目标仓库，否则 gh 会尝试读取 .git。
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* \
              --title "Flashcast ${TAG#v}" \
              --generate-notes \
              --verify-tag
          fi
          gh release view "$TAG" --json url --jq '"Release: " + .url'
