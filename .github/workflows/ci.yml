# Flashcast 三平台 CI（ticket 01 建立，尚未在 GitHub 上实际运行过）。
# 编译结果与桌面交互结果分开汇报，见末尾的 summarise 步骤。

name: CI

on:
  push:
  pull_request:

# 同一 ref 上的新提交取消旧的运行。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 统一用 bash：Windows runner 自带 Git Bash，避免 PowerShell 与 POSIX 命令的差异。
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            slug: linux-x64
            os: ubuntu-22.04
            target: ""
            cargo_args: ""
            rust_targets: ""
          - name: Windows x64
            slug: windows-x64
            os: windows-latest
            target: ""
            cargo_args: ""
            rust_targets: ""
          # macOS Apple Silicon：原生构建，不传 --target。
          - name: macOS arm64 (native)
            slug: macos-arm64
            os: macos-latest
            target: ""
            cargo_args: ""
            rust_targets: ""
          # macOS Intel：在 arm64 runner 上交叉编译（不使用已下线的 macos-13）。
          - name: macOS x86_64 (cross-compiled)
            slug: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            cargo_args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      # Tauri 2 需要 WebKitGTK 4.1（libsoup 3）。Ubuntu 22.04 上 4.0 的 dev 包同样存在，
      # 误链 4.0 也能编译通过、只在运行时出问题，所以这里显式断言 4.1 可被 pkg-config 解析。
      - name: Assert WebKitGTK 4.1 is what pkg-config resolves
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          if ! version="$(pkg-config --modversion webkit2gtk-4.1 2>/dev/null)"; then
            echo "::error::pkg-config 找不到 webkit2gtk-4.1；构建可能静默链接到 4.0 ABI。"
            exit 1
          fi
          echo "webkit2gtk-4.1 = ${version}"
          if legacy="$(pkg-config --modversion webkit2gtk-4.0 2>/dev/null)"; then
            echo "::warning::镜像里同时存在 webkit2gtk-4.0 (${legacy})；以 4.1 断言为准。"
          fi

      # OpenSSL 随包编译（`vendored-openssl`），因为它必须为目标架构构建：
      # macOS 的 x86_64 是在 arm64 runner 上交叉编译的，那里只有 arm64 的 Homebrew
      # OpenSSL，openssl-sys 会直接失败（CI 运行 36782404097 实测）。
      # 这里显式告诉 clang 与 openssl 的 Configure 目标架构，否则会编出 arm64 的库。
      - name: Cross-compile flags for macOS x86_64
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          {
            echo "CC_x86_64_apple_darwin=clang"
            echo "CXX_x86_64_apple_darwin=clang++"
            echo "CFLAGS_x86_64_apple_darwin=-arch x86_64"
            echo "CXXFLAGS_x86_64_apple_darwin=-arch x86_64"
          } >> "$GITHUB_ENV"

      # vendored OpenSSL 在 Windows 上需要 Perl 与 NASM（openssl-src 的汇编器）。
      # 缺少时给出可读的失败原因，而不是让 openssl-src 抛出难懂的报错。
      - name: Assert Perl and NASM (Windows, for vendored OpenSSL)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          ok=1
          if ! perl -v >/dev/null 2>&1; then echo "::error::缺少 Perl，无法编译 vendored OpenSSL。"; ok=0; fi
          if ! nasm -v >/dev/null 2>&1; then echo "::error::缺少 NASM，无法编译 vendored OpenSSL。"; ok=0; fi
          [ "$ok" = "1" ] || exit 1
          perl -v | head -2
          nasm -v

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.slug }}

      # 交叉编译出来的 x86_64 测试二进制要在 arm64 runner 上运行，需要 Rosetta 2。
      # 已安装时该命令本身是幂等的，因此容忍它的退出码。
      - name: Ensure Rosetta 2 (macOS x86_64 cross-compile only)
        if: matrix.target == 'x86_64-apple-darwin'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      # 前端必须先构建：`pnpm build` 本身就是对 UI/TS 的真实检查，而且
      # `generate_context!` 在**非 dev** 构建里会嵌入 `frontendDist`（缺失时直接 panic），
      # ticket 04 的打包会走这条路。注意 dev（debug）构建走 `devUrl`，不嵌入 dist。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend bundle
        run: pnpm build

      - name: Test workspace (cargo test --workspace)
        id: test
        run: cargo test --workspace ${{ matrix.cargo_args }}

      # 明确证明前端产物存在，而不是等打包时才发现 dist/ 是空的。
      # （debug 的 `cargo build -p flashcast` 走 devUrl、不嵌入 dist；这条断言守的是
      # release / `tauri build` 那条路径，见 tauri-codegen 的 frontendDist 分支。）
      - name: Assert the frontend bundle exists
        run: |
          set -euo pipefail
          if [ ! -s dist/index.html ]; then
            echo "::error::dist/index.html 缺失或为空；release/打包构建会因此失败或缺少界面。"
            exit 1
          fi
          echo "dist/ 内容："
          ls -l dist
          ls -l dist/assets

      - name: Build desktop host (cargo build -p flashcast)
        id: build
        run: cargo build -p flashcast ${{ matrix.cargo_args }}

      # 真实平台检查：热键、焦点读取、软件发现、X11 诊断。
      # 结果可能是「实测失败」或「未覆盖」（无头 runner 上没有 X11 会话），
      # 但这属于桌面交互结论，不应与编译结果混为一谈，因此本步骤单独记录、不掩盖。
      - name: Run real platform check (stdout captured to artifacts/)
        id: platform_check
        continue-on-error: true
        run: |
          mkdir -p artifacts
          cargo run -p flashcast-platform --bin flashcast-platform-check \
            ${{ matrix.cargo_args }} | tee "artifacts/platform-check-${{ matrix.slug }}.log"
          cargo run -p flashcast-platform --bin flashcast-platform-check \
            ${{ matrix.cargo_args }} -- --json \
            --output "artifacts/platform-check-${{ matrix.slug }}.json"

      # Windows 的检查列表比 Linux 多三项（apps.launch / focus.restore / win.shell），
      # 与 Linux 共有的那些 id 必须一个不少。这一步只证明「Windows 分支跑到了每一个
      # 检查」，不证明桌面行为通过 —— 后者由报告里的状态行给出（无头 runner 上
      # 快捷键与焦点通常为「未覆盖」）。缺少 id 是代码问题，因此这一步不 continue-on-error。
      - name: Assert the Windows platform check reports every required id
        if: matrix.slug == 'windows-x64'
        run: |
          set -euo pipefail
          report="artifacts/platform-check-${{ matrix.slug }}.json"
          if [ ! -s "$report" ]; then
            echo "::error::缺少 $report；Windows 平台检查没有产出 JSON 报告。"
            exit 1
          fi
          missing=0
          for id in \
            build.compile \
            session.detect \
            apps.discovery \
            apps.launch \
            focus.capture \
            focus.restore \
            hotkey.register \
            clipboard.text \
            paste.auto \
            win.shell \
            x11.diagnostics
          do
            if ! grep -q "\"id\": \"${id}\"" "$report"; then
              echo "::error::Windows 平台检查缺少 check id：${id}"
              missing=1
            fi
          done
          if [ "$missing" != "0" ]; then
            exit 1
          fi
          echo "Windows 平台检查报告包含全部必需 check id：$report"

      # 把「编译结果」与「桌面交互结果」分别写进 job summary，避免绿色编译被误读为
      # 热键/托盘/粘贴检查通过。
      - name: Summarise compilation vs desktop interaction
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "| 项目 | 步骤结果 |"
            echo "| --- | --- |"
            echo "| 编译：\`cargo test --workspace\` | ${{ steps.test.outcome }} |"
            echo "| 编译：\`cargo build -p flashcast\` | ${{ steps.build.outcome }} |"
            echo "| 桌面交互：\`flashcast-platform-check\` | ${{ steps.platform_check.outcome }} |"
            echo ""
            echo "编译成功**不代表**全局快捷键、托盘入口或自动粘贴可用；那三项只以上表第三行"
            echo "报告里的「实测通过 / 实测失败 / 未覆盖」为准（无头 runner 通常为「未覆盖」）。"
            echo ""
            if [ -f "artifacts/platform-check-${{ matrix.slug }}.log" ]; then
              echo '```'
              grep -E '^\[|^汇总' "artifacts/platform-check-${{ matrix.slug }}.log" || true
              echo '```'
            else
              echo "_未取得 platform_check 输出。_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics (and screenshots when present)
        if: always()
        # v8 不存在（研究笔记的版本表：upload-artifact 最新大版本是 v7）。
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.slug }}
          path: |
            artifacts/platform-check-*.log
            artifacts/platform-check-*.json
            artifacts/ui/**
          if-no-files-found: ignore
          retention-days: 14

  # 廉价的跨目标类型检查：不用 macOS / Windows runner 就能发现
  # 「#[cfg(target_os)] 条件编译写漏了」这类问题。ticket 01 踩过一次：
  # `platform_check` 无条件引用 `flashcast_platform::linux`，会让 3 个矩阵分支编译失败。
  #
  # 只检查 `flashcast-platform`：Tauri 外壳无法在 Linux 上交叉 `cargo check` ——
  # Windows 目标需要 `llvm-rc` 嵌入图标，macOS 目标需要能识别 `-arch` 的 Apple 工具链。
  # 那两个目标由主矩阵里各自的 runner 覆盖。
  cross-check:
    name: 跨目标类型检查 ${{ matrix.target }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: cross-check-${{ matrix.target }}

      - name: Type check flashcast-platform for ${{ matrix.target }}
        run: cargo check -p flashcast-platform --target ${{ matrix.target }}

  # ── ticket 04：候选安装包 ────────────────────────────────────────────────
  #
  # 目标：让每个提交都能下载到三平台候选安装包。**不创建 GitHub Release**（发布是
  # ticket 18 的事），job 级 permissions 只给 contents: read —— 即使 tauri-action 想建
  # Release 也没有权限，这是比「不传 tagName」更强的保证。
  #
  # 跨 OS 打包不可能（Linux 上做不出 exe，Windows 上做不出 dmg），所以一个 OS 一个 job，
  # 用 tauri-apps/tauri-action@v1（官方文档的 macOS 签名页仍写 @v0，是过时的）。
  # 本仓库是 Cargo workspace，bundle 落在仓库根的 `target/` 下。
  #
  # 这里不依赖 verify 矩阵：候选包要尽早可用，是否允许发布由 ticket 18 汇总所有必需
  # 检查后再决定。各平台的真实检查结果由 `scripts/ci/check-installers.sh` 逐平台记录。
  bundle:
    name: 候选安装包 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 AppImage + deb
            slug: linux-x64
            os: ubuntu-22.04
            platform: linux
            arch: amd64
            target: ""
            bundles: appimage,deb
            rust_targets: ""
          - name: Windows x64 NSIS exe
            slug: windows-x64
            os: windows-latest
            platform: windows
            arch: x64
            target: ""
            bundles: nsis
            rust_targets: ""
          # macOS 两种架构都在 arm64 runner 上交叉编译。`macos-13` 标签已不存在，
          # 用它会永远排队；Intel 架构改用 --target x86_64-apple-darwin。
          - name: macOS arm64 dmg
            slug: macos-arm64
            os: macos-latest
            platform: macos
            arch: aarch64
            target: aarch64-apple-darwin
            bundles: dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: macOS x64 dmg (cross-compiled)
            slug: macos-x64
            os: macos-latest
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            bundles: dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      # OpenSSL 随包编译（`vendored-openssl`），必须为目标架构构建：macOS 的 x86_64
      # 在 arm64 runner 上交叉编译，那里只有 arm64 的 Homebrew OpenSSL。与 verify 矩阵
      # 同样显式给出 clang 的目标架构，否则 openssl 的 Configure 会编出 arm64 的库。
      - name: Cross-compile flags for macOS x86_64
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          {
            echo "CC_x86_64_apple_darwin=clang"
            echo "CXX_x86_64_apple_darwin=clang++"
            echo "CFLAGS_x86_64_apple_darwin=-arch x86_64"
            echo "CXXFLAGS_x86_64_apple_darwin=-arch x86_64"
          } >> "$GITHUB_ENV"

      # vendored OpenSSL 在 Windows 上需要 Perl 与 NASM；缺少时给出可读原因。
      - name: Assert Perl and NASM (Windows, for vendored OpenSSL)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          ok=1
          if ! perl -v >/dev/null 2>&1; then echo "::error::缺少 Perl，无法编译 vendored OpenSSL。"; ok=0; fi
          if ! nasm -v >/dev/null 2>&1; then echo "::error::缺少 NASM，无法编译 vendored OpenSSL。"; ok=0; fi
          [ "$ok" = "1" ] || exit 1

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            xdg-utils \
            xvfb \
            dbus-x11 \
            file

      # AppImage 打包走 linuxdeploy，它同样需要 4.1 的 .pc；链接错了只会在运行时出问题。
      - name: Assert WebKitGTK 4.1 is what pkg-config resolves
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          version="$(pkg-config --modversion webkit2gtk-4.1)"
          echo "webkit2gtk-4.1 = ${version}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.slug }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend bundle
        run: pnpm build

      # `generate_context!` 在非 dev 构建里会嵌入 frontendDist（../dist），缺失时直接 panic；
      # 安装包里没有界面就等于包装错了，所以这里先断言 dist/index.html 存在。
      - name: Assert the frontend bundle exists before bundling
        run: |
          set -euo pipefail
          if [ ! -s dist/index.html ]; then
            echo "::error::dist/index.html 缺失或为空；安装包里不会有界面。"
            exit 1
          fi
          ls -l dist dist/assets

      # macOS：没有 Apple 证书时用 ad-hoc 签名（签名标识 `-`），避免 Apple Silicon 把
      # 下载来的应用报成「已损坏」。ad-hoc **不能**绕过 Gatekeeper，报告里会如实写明。
      # 有证书时按 Tauri 文档接入正式签名；凭证只经 GITHUB_ENV 传给后续步骤，不落仓库、不进日志。
      - name: Decide macOS signing mode (ad-hoc or Developer ID)
        id: macos_signing
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cert=no
          identity=no
          [ -n "${APPLE_CERTIFICATE:-}" ] && cert=yes
          [ -n "${APPLE_SIGNING_IDENTITY_SECRET:-}" ] && identity=yes
          # APPLE_CERTIFICATE 与 APPLE_SIGNING_IDENTITY 必须成对出现：tauri-bundler 会拿
          # tauri.conf.json 里的 signingIdentity（本仓库是 `-`）去匹配导入的证书，只有一边
          # 存在时会以晦涩的错误中断。这里提前给出可执行的提示。
          if [ "$cert" = yes ] && [ "$identity" = no ]; then
            echo "::error::提供了 APPLE_CERTIFICATE 却没有 APPLE_SIGNING_IDENTITY；请同时提供（值取自 security find-identity -v -p codesigning）。"
            exit 1
          fi
          if [ "$cert" = no ] && [ "$identity" = yes ]; then
            echo "::error::提供了 APPLE_SIGNING_IDENTITY 却没有 APPLE_CERTIFICATE；CI 上没有可导入的证书。"
            exit 1
          fi
          if [ "$cert" = yes ]; then
            mode=developer-id
            {
              echo "APPLE_CERTIFICATE=${APPLE_CERTIFICATE}"
              echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD}"
              echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY_SECRET}"
            } >>"$GITHUB_ENV"
            if [ -n "${KEYCHAIN_PASSWORD:-}" ]; then
              echo "KEYCHAIN_PASSWORD=${KEYCHAIN_PASSWORD}" >>"$GITHUB_ENV"
            fi
            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
              notarize=yes
              {
                echo "APPLE_ID=${APPLE_ID}"
                echo "APPLE_PASSWORD=${APPLE_PASSWORD}"
                echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
              } >>"$GITHUB_ENV"
            else
              notarize=no
              echo "::warning::有签名证书但 APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 不完整，跳过公证；Gatekeeper 仍会拦截首次启动。"
            fi
          else
            mode=ad-hoc
            notarize=no
            # 只写 `-`，绝不写空值：APPLE_SIGNING_IDENTITY 为空会让 Tauri 用空标识去 codesign。
            echo "APPLE_SIGNING_IDENTITY=-" >>"$GITHUB_ENV"
          fi
          printf 'mode=%s\nnotarize=%s\n' "$mode" "$notarize" >>"$GITHUB_OUTPUT"
          printf '%s\n' "$mode" >"artifacts/macos-signing-mode-${{ matrix.slug }}.txt"
          echo "macOS 签名模式：${mode}（公证：${notarize}）"

      # Windows：有 Authenticode 证书时导入到当前用户的证书存储，并把指纹通过 --config 传给
      # tauri build；没有证书时保持未签名，并在报告里写明 SmartScreen 的提示与绕过方式。
      - name: Import Windows code signing certificate when provided
        id: windows_signing
        if: matrix.platform == 'windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -z "${WINDOWS_CERTIFICATE:-}" ]; then
            printf 'unsigned\n' >"artifacts/windows-signing-mode-${{ matrix.slug }}.txt"
            echo "::notice::未提供 WINDOWS_CERTIFICATE，NSIS 安装程序不带 Authenticode 签名。"
            exit 0
          fi
          pfx="$RUNNER_TEMP/flashcast-codesign.pfx"
          # tauri-action 的 args 以空白切分，--config 的路径里不能有空格；有的话直接报错，
          # 免得退化成「指纹没传进去、包静默未签名」。
          case "$RUNNER_TEMP" in
            *" "*)
              echo "::error::RUNNER_TEMP 含空格，--config 路径无法通过 tauri-action 的 args 传递。"
              exit 1
              ;;
          esac
          echo "${WINDOWS_CERTIFICATE}" | base64 --decode >"$pfx"
          thumbprint="$(powershell.exe -NoProfile -NonInteractive -Command \
            "\$p = ConvertTo-SecureString -String \$env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText; (Import-PfxCertificate -FilePath '$(cygpath -w "$pfx")' -CertStoreLocation Cert:\\CurrentUser\\My -Password \$p).Thumbprint" \
            | tr -d '\r' | tail -n 1)"
          if [ -z "$thumbprint" ]; then
            echo "::error::导入 Windows 代码签名证书失败。"
            exit 1
          fi
          config="$RUNNER_TEMP/flashcast-windows-signing.json"
          printf '{"bundle":{"windows":{"certificateThumbprint":"%s","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}\n' \
            "$thumbprint" >"$config"
          printf 'signed\n' >"artifacts/windows-signing-mode-${{ matrix.slug }}.txt"
          printf 'config_args=--config %s\n' "$config" >>"$GITHUB_OUTPUT"
          echo "已导入 Windows 代码签名证书，指纹 ${thumbprint}。"

      - name: Build bundles (tauri-action)
        id: tauri
        uses: tauri-apps/tauri-action@v1
        with:
          # 不传 tagName / releaseId：tauri-action 只构建，不创建 Release。
          args: >-
            ${{ matrix.target != '' && format('--target {0} --bundles {1}', matrix.target, matrix.bundles) || format('--bundles {0}', matrix.bundles) }}
            ${{ steps.windows_signing.outputs.config_args }}

      - name: Check installer content, install and startup
        id: installer_check
        run: |
          set -euo pipefail
          mkdir -p artifacts
          scripts/ci/check-installers.sh \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --slug "${{ matrix.slug }}" \
            --target "${{ matrix.target }}" \
            --artifacts-dir artifacts \
            --display-mode auto \
            2>&1 | tee "artifacts/installer-check-${{ matrix.slug }}.log"

      # 把「编译成功」与「安装/启动实测」分开汇报：只有创建压缩文件不算安装通过。
      - name: Summarise installer checks
        if: always()
        run: |
          set -uo pipefail
          json="artifacts/installer-check-${{ matrix.slug }}.json"
          {
            echo "### 候选安装包 ${{ matrix.name }}"
            echo ""
            if [ ! -f "$json" ]; then
              echo "_未取得检查报告（构建可能已失败）。_"
            elif ! command -v jq >/dev/null 2>&1; then
              echo '```'
              cat "$json"
              echo '```'
            else
              echo "| 产物 | 类型 | 字节 | SHA256 |"
              echo "| --- | --- | --- | --- |"
              jq -r '.artifacts[] | "| `\(.name)` | \(.kind) | \(.sizeBytes) | `\(.sha256[0:16])…` |"' "$json"
              echo ""
              echo "| 检查 | 结果 | 说明 |"
              echo "| --- | --- | --- |"
              jq -r '.checks[] | "| \(.title) | \(.statusLabel) | \(.detail | gsub("\\|"; "\\|")) |"' "$json"
              echo ""
              echo "签名状态："
              echo ""
              jq -r '.signing[] | "- **\(.scope)**：\(.status) —— \(.detail)"' "$json"
              echo ""
              jq -r '.summary | "汇总：实测通过 \(.measuredPass)，实测失败 \(.measuredFail)，未覆盖 \(.notCovered)"' "$json"
            fi
            echo ""
            echo "「未覆盖」表示该检查在当前 runner 上无法执行，**不等于通过**。"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload candidate installers and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flashcast-candidate-${{ matrix.slug }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14

      - name: Remove the temporary Windows signing certificate
        if: always() && matrix.platform == 'windows'
        run: |
          set -uo pipefail
          rm -f "${RUNNER_TEMP:-}/flashcast-codesign.pfx" "${RUNNER_TEMP:-}/flashcast-windows-signing.json"

  # ── 汇总 SHA256 ─────────────────────────────────────────────────────────
  # 重新计算所有安装包的 SHA256 并与各 job 自己算出的值比对（校验上传/下载链路），
  # 产出 SHA256SUMS.txt 供 ticket 18 附加到 Release。这里同样不创建 Release。
  checksums:
    name: SHA256 校验和
    needs: [bundle]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Download all candidate installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate and verify SHA256SUMS
        run: |
          set -euo pipefail
          scripts/ci/verify-sha256sums.sh artifacts 2>&1 | tee artifacts/sha256-report.txt

      - name: Summarise checksums
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### SHA256 校验和"
            echo ""
            if [ -f artifacts/SHA256SUMS.txt ]; then
              echo '```'
              cat artifacts/SHA256SUMS.txt
              echo '```'
            else
              echo "_没有生成 SHA256SUMS.txt：没有任何安装包产物。_"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload SHA256SUMS
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flashcast-sha256sums
          path: |
            artifacts/SHA256SUMS.txt
            artifacts/sha256-report.txt
            artifacts/*.sha256
          # SHA256SUMS.txt 是 ticket 18 附加到 Release 的必需资产；缺了必须让 job 变红，
          # 不能只警告——第一次真实运行就是因为相对输出路径而「静默没有产出」。
          if-no-files-found: error
          retention-days: 30
