# Flashcast 三平台检查；安装包由 release.yml 产出。
# 编译结果与桌面交互结果分开汇报，见末尾的 summarise 步骤。

name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '.scratch/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.scratch/**'
      - '**/*.md'
  workflow_dispatch:

# 同一 ref 上的新提交取消旧的运行。
# 标签由独立的 Release 工作流处理。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认最小权限：整个 workflow 只需要读仓库内容。
# CI 只检查；Release 工作流单独授予发布权限。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 统一用 bash：Windows runner 自带 Git Bash，避免 PowerShell 与 POSIX 命令的差异。
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            slug: linux-x64
            os: ubuntu-22.04
            target: ""
            cargo_args: ""
            rust_targets: ""
          - name: Windows x64
            slug: windows-x64
            os: windows-latest
            target: ""
            cargo_args: ""
            rust_targets: ""
          # macOS Apple Silicon：原生构建，不传 --target。
          - name: macOS arm64 (native)
            slug: macos-arm64
            os: macos-latest
            target: ""
            cargo_args: ""
            rust_targets: ""
          # macOS Intel：在 arm64 runner 上交叉编译（不使用已下线的 macos-13）。
          - name: macOS x86_64 (cross-compiled)
            slug: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            cargo_args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      # Tauri 2 需要 WebKitGTK 4.1（libsoup 3）。Ubuntu 22.04 上 4.0 的 dev 包同样存在，
      # 误链 4.0 也能编译通过、只在运行时出问题，所以这里显式断言 4.1 可被 pkg-config 解析。
      - name: Assert WebKitGTK 4.1 is what pkg-config resolves
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          if ! version="$(pkg-config --modversion webkit2gtk-4.1 2>/dev/null)"; then
            echo "::error::pkg-config 找不到 webkit2gtk-4.1；构建可能静默链接到 4.0 ABI。"
            exit 1
          fi
          echo "webkit2gtk-4.1 = ${version}"
          if legacy="$(pkg-config --modversion webkit2gtk-4.0 2>/dev/null)"; then
            echo "::warning::镜像里同时存在 webkit2gtk-4.0 (${legacy})；以 4.1 断言为准。"
          fi

      # OpenSSL 随包编译（`vendored-openssl`），因为它必须为目标架构构建：
      # macOS 的 x86_64 是在 arm64 runner 上交叉编译的，那里只有 arm64 的 Homebrew
      # OpenSSL，openssl-sys 会直接失败（CI 运行 36782404097 实测）。
      # 这里显式告诉 clang 与 openssl 的 Configure 目标架构，否则会编出 arm64 的库。
      - name: Cross-compile flags for macOS x86_64
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          {
            echo "CC_x86_64_apple_darwin=clang"
            echo "CXX_x86_64_apple_darwin=clang++"
            echo "CFLAGS_x86_64_apple_darwin=-arch x86_64"
            echo "CXXFLAGS_x86_64_apple_darwin=-arch x86_64"
          } >> "$GITHUB_ENV"

      # vendored OpenSSL 在 Windows 上需要 Perl 与 NASM（openssl-src 的汇编器）。
      # 缺少时给出可读的失败原因，而不是让 openssl-src 抛出难懂的报错。
      - name: Assert Perl and NASM (Windows, for vendored OpenSSL)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          ok=1
          if ! perl -v >/dev/null 2>&1; then echo "::error::缺少 Perl，无法编译 vendored OpenSSL。"; ok=0; fi
          if ! nasm -v >/dev/null 2>&1; then echo "::error::缺少 NASM，无法编译 vendored OpenSSL。"; ok=0; fi
          [ "$ok" = "1" ] || exit 1
          perl -v | head -2
          nasm -v

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.slug }}

      # 交叉编译出来的 x86_64 测试二进制要在 arm64 runner 上运行，需要 Rosetta 2。
      # 已安装时该命令本身是幂等的，因此容忍它的退出码。
      - name: Ensure Rosetta 2 (macOS x86_64 cross-compile only)
        if: matrix.target == 'x86_64-apple-darwin'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      # 前端必须先构建：`pnpm build` 本身就是对 UI/TS 的真实检查，而且
      # `generate_context!` 在**非 dev** 构建里会嵌入 `frontendDist`（缺失时直接 panic），
      # ticket 04 的打包会走这条路。注意 dev（debug）构建走 `devUrl`，不嵌入 dist。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend bundle
        run: pnpm build

      - name: Test workspace (cargo test --workspace)
        id: test
        run: cargo test --workspace ${{ matrix.cargo_args }}

      # 明确证明前端产物存在，而不是等打包时才发现 dist/ 是空的。
      # （debug 的 `cargo build -p flashcast` 走 devUrl、不嵌入 dist；这条断言守的是
      # release / `tauri build` 那条路径，见 tauri-codegen 的 frontendDist 分支。）
      - name: Assert the frontend bundle exists
        run: |
          set -euo pipefail
          if [ ! -s dist/index.html ]; then
            echo "::error::dist/index.html 缺失或为空；release/打包构建会因此失败或缺少界面。"
            exit 1
          fi
          echo "dist/ 内容："
          ls -l dist
          ls -l dist/assets

      - name: Build desktop host (cargo build -p flashcast)
        id: build
        run: cargo build -p flashcast ${{ matrix.cargo_args }}

      # 真实平台检查：热键、焦点读取、软件发现、X11 诊断。
      # 结果可能是「实测失败」或「未覆盖」（无头 runner 上没有 X11 会话），
      # 但这属于桌面交互结论，不应与编译结果混为一谈，因此本步骤单独记录、不掩盖。
      - name: Run real platform check (stdout captured to artifacts/)
        id: platform_check
        continue-on-error: true
        run: |
          mkdir -p artifacts
          cargo run -p flashcast-platform --bin flashcast-platform-check \
            ${{ matrix.cargo_args }} | tee "artifacts/platform-check-${{ matrix.slug }}.log"
          cargo run -p flashcast-platform --bin flashcast-platform-check \
            ${{ matrix.cargo_args }} -- --json \
            --output "artifacts/platform-check-${{ matrix.slug }}.json"

      # Windows 的检查列表比 Linux 多三项（apps.launch / focus.restore / win.shell），
      # 与 Linux 共有的那些 id 必须一个不少。这一步只证明「Windows 分支跑到了每一个
      # 检查」，不证明桌面行为通过 —— 后者由报告里的状态行给出（无头 runner 上
      # 快捷键与焦点通常为「未覆盖」）。缺少 id 是代码问题，因此这一步不 continue-on-error。
      - name: Assert the Windows platform check reports every required id
        if: matrix.slug == 'windows-x64'
        run: |
          set -euo pipefail
          report="artifacts/platform-check-${{ matrix.slug }}.json"
          if [ ! -s "$report" ]; then
            echo "::error::缺少 $report；Windows 平台检查没有产出 JSON 报告。"
            exit 1
          fi
          missing=0
          for id in \
            build.compile \
            session.detect \
            apps.discovery \
            apps.launch \
            focus.capture \
            focus.restore \
            hotkey.register \
            clipboard.text \
            paste.auto \
            win.shell \
            x11.diagnostics
          do
            if ! grep -q "\"id\": \"${id}\"" "$report"; then
              echo "::error::Windows 平台检查缺少 check id：${id}"
              missing=1
            fi
          done
          if [ "$missing" != "0" ]; then
            exit 1
          fi
          echo "Windows 平台检查报告包含全部必需 check id：$report"

      # 把「编译结果」与「桌面交互结果」分别写进 job summary，避免绿色编译被误读为
      # 热键/托盘/粘贴检查通过。
      - name: Summarise compilation vs desktop interaction
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "| 项目 | 步骤结果 |"
            echo "| --- | --- |"
            echo "| 编译：\`cargo test --workspace\` | ${{ steps.test.outcome }} |"
            echo "| 编译：\`cargo build -p flashcast\` | ${{ steps.build.outcome }} |"
            echo "| 桌面交互：\`flashcast-platform-check\` | ${{ steps.platform_check.outcome }} |"
            echo ""
            echo "编译成功**不代表**全局快捷键、托盘入口或自动粘贴可用；那三项只以上表第三行"
            echo "报告里的「实测通过 / 实测失败 / 未覆盖」为准（无头 runner 通常为「未覆盖」）。"
            echo ""
            if [ -f "artifacts/platform-check-${{ matrix.slug }}.log" ]; then
              echo '```'
              grep -E '^\[|^汇总' "artifacts/platform-check-${{ matrix.slug }}.log" || true
              echo '```'
            else
              echo "_未取得 platform_check 输出。_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics (and screenshots when present)
        if: always()
        # v8 不存在（研究笔记的版本表：upload-artifact 最新大版本是 v7）。
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.slug }}
          path: |
            artifacts/platform-check-*.log
            artifacts/platform-check-*.json
            artifacts/ui/**
          if-no-files-found: ignore
          retention-days: 14

  # 廉价的跨目标类型检查：不用 macOS / Windows runner 就能发现
  # 「#[cfg(target_os)] 条件编译写漏了」这类问题。ticket 01 踩过一次：
  # `platform_check` 无条件引用 `flashcast_platform::linux`，会让 3 个矩阵分支编译失败。
  #
  # 只检查 `flashcast-platform`：Tauri 外壳无法在 Linux 上交叉 `cargo check` ——
  # Windows 目标需要 `llvm-rc` 嵌入图标，macOS 目标需要能识别 `-arch` 的 Apple 工具链。
  # 那两个目标由主矩阵里各自的 runner 覆盖。
  cross-check:
    name: 跨目标类型检查 ${{ matrix.target }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: cross-check-${{ matrix.target }}

      - name: Type check flashcast-platform for ${{ matrix.target }}
        run: cargo check -p flashcast-platform --target ${{ matrix.target }}

  browser:
    name: 浏览器交互检查
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tools/ui-check/pnpm-lock.yaml
      - name: Install frontend and browser check dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir tools/ui-check install --frozen-lockfile
      - name: Check release gates
        run: pnpm release:check
      - name: Check dev watcher isolation
        run: pnpm dev:check
      - name: Browser interaction gate
        run: pnpm ui-check
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-interaction
          path: artifacts/ui/
          if-no-files-found: error
          retention-days: 14
